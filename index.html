<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>字卡情侣模拟器</title>
<style>
:root{--primary:#FF8DA1;--primary-light:#FDEBF0;--bg:#FFFFFF;--card:#FFFFFF;--text:#333;--text-light:#999;--border:#F0F0F0;--green:#95ec69;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{margin:0;height:100%;overflow:hidden}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.hidden-file{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;overflow:hidden}
.panel{flex:1;overflow-y:auto;position:relative;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.topbar{height:56px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.topbar h1{font-size:17px;margin:0;flex:1;font-weight:600}
.btn{border:0;background:var(--primary);color:#fff;padding:8px 14px;border-radius:18px;font-size:13px;cursor:pointer}
.icon{border:0;background:transparent;cursor:pointer;color:#333;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;font-size:20px}
.icon svg{width:22px;height:22px;display:block}
.icon:active{background:var(--primary-light)}
.bottom-nav{height:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:var(--card);border-top:1px solid var(--border);position:absolute;bottom:0;left:0;right:0;z-index:20}
.bottom-nav button{flex:1;border:0;background:transparent;font-size:11px;color:#888;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0}
.bottom-nav button.active{color:var(--primary);font-weight:600}
.bottom-nav button .nav-icon{display:flex;align-items:center;justify-content:center;height:24px}
.bottom-nav button .nav-icon svg{width:23px;height:23px;display:block}
.list{padding:0 14px}
.row{display:flex;gap:12px;padding:13px 0;align-items:center;border-bottom:1px solid var(--border);cursor:pointer}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:500}
.row-sub{font-size:12px;color:var(--text-light);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10px;background:var(--primary);color:#fff;border-radius:4px;padding:1px 6px;margin-left:6px}
.empty{padding:50px 20px;text-align:center;color:#ccc;font-size:14px}
.avatar-sm{width:48px;height:48px;border-radius:12px;overflow:hidden;flex:none;background:#eee;display:flex;align-items:center;justify-content:center}
.avatar-sm img{width:100%;height:100%;object-fit:cover}
.avatar-txt{font-size:20px;color:#fff;background:var(--primary);width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.home{padding:16px}
.couple-card{background:var(--card);border-radius:24px;padding:22px 18px 18px;box-shadow:0 4px 20px rgba(253,235,240,.9);text-align:center;border:1px solid var(--primary-light);margin-bottom:16px}
.couple-avatars{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:12px}
.avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.avatar-lg{width:72px;height:72px;border-radius:50%;overflow:hidden;background:#eee;border:3px solid var(--primary-light);display:flex;align-items:center;justify-content:center}
.avatar-lg img{width:100%;height:100%;object-fit:cover}
.avatar-lg .avatar-txt{font-size:28px}
.heart-icon{display:flex;align-items:center;justify-content:center}
.heart-icon svg{width:22px;height:22px;stroke:#222;fill:none;stroke-width:1.8}
.name-tag{font-size:12px;color:var(--text-light);background:#F5F5F5;padding:2px 10px;border-radius:10px}
.days-box{margin-top:14px;border-top:1px solid var(--border);padding-top:14px}
.days-num{font-size:32px;font-weight:700;display:inline-block}
.days-num-unit{font-size:14px;color:var(--text-light);margin-left:6px}
.days-sub{font-size:12px;color:var(--text-light);margin-top:4px}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.widget{background:var(--card);border-radius:18px;padding:18px;border:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.widget-icon{color:#333;display:flex;align-items:center;justify-content:flex-start;height:32px}
.widget-icon svg{width:30px;height:30px;stroke-width:1.6}
.widget-title{font-size:14px;font-weight:600}
.widget-sub{font-size:11px;color:var(--text-light)}
.chat{display:flex;flex-direction:column;height:100%;position:relative}
.chat-head{height:56px;display:flex;align-items:center;padding:0 8px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;flex-shrink:0}
.chat-title{flex:1;font-size:16px;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px;background-size:cover;background-position:center;background-repeat:no-repeat;min-height:0}
.sys-msg{text-align:center;color:#999;font-size:12px;padding:6px 14px;background:rgba(245,245,245,.85);border-radius:14px;align-self:center;max-width:85%;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.sys-msg svg{width:14px;height:14px;display:block}
.msg{display:flex;gap:10px;align-items:flex-start;position:relative}
.msg.mine{flex-direction:row-reverse}
.m-avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;background:#eee}
.m-avatar img{width:100%;height:100%;object-fit:cover}
.m-avatar .avatar-txt{font-size:16px}
.m-body{max-width:75%;display:flex;flex-direction:column;min-width:0}
.msg.mine .m-body{align-items:flex-end}
.m-name{font-size:11px;color:var(--text-light);margin-bottom:3px;padding-left:4px}
.msg-time{font-size:10px;color:#bbb;margin-top:4px;padding:0 4px}
.msg.mine .msg-time{text-align:right}
.msg:not(.mine) .msg-time{text-align:left}
.quote-block{font-size:12px;color:#888;background:rgba(245,245,245,.9);border-left:3px solid #ccc;padding:4px 8px;border-radius:6px;margin-bottom:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px}
.quote-block img{max-height:30px;border-radius:4px}
.bubble{padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.5;word-break:break-word;white-space:pre-wrap;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.bubble .kaomoji{font-size:15px;font-family:monospace}
.bubble .emoji{font-size:30px;line-height:1.2}
.card-img{max-width:110px;max-height:140px;border-radius:10px;display:block;object-fit:contain;cursor:zoom-in;background:#f5f5f5}
.bubble-imgs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.bubble-imgs img{width:80px;height:80px;object-fit:cover;border-radius:8px;cursor:zoom-in}
.composer{flex:none;background:var(--card);border-top:1px solid var(--border);padding:8px 10px}
.quote-bar{display:flex;align-items:center;gap:8px;background:#F5F5F5;border-radius:10px;padding:6px 10px;margin-bottom:6px;font-size:12px;color:#666}
.quote-bar .q-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px}
.quote-bar .q-text img{max-height:24px;border-radius:4px}
.quote-bar .q-close{border:0;background:transparent;font-size:16px;color:#999;cursor:pointer;padding:0 4px}
.composer-row{display:flex;gap:6px;align-items:center}
.composer-row input{flex:1;border:1px solid var(--border);border-radius:20px;padding:10px 14px;font-size:15px;outline:none;background:var(--bg);color:var(--text);min-width:0}
.cicon{width:38px;height:38px;border:0;background:transparent;color:#666;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;text-decoration:none}
.cicon:active{background:var(--primary-light)}
.cicon svg{width:22px;height:22px}
.send-btn2{background:#1a1a1a;color:#fff;border:0;padding:0 18px;height:38px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0}
.panel-sheet{background:#FAFAFA;border-top:1px solid var(--border);max-height:60vh;overflow-y:auto;padding:12px}
.sheet-tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;align-items:center}
.sheet-tabs::-webkit-scrollbar{display:none}
.sheet-tab{padding:8px 16px;background:#fff;border:1px solid var(--border);border-radius:18px;font-size:13px;cursor:pointer;color:#555;white-space:nowrap;flex-shrink:0}
.sheet-tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.sheet-tab.add{background:var(--primary);color:#fff;border-color:var(--primary);margin-left:auto;font-weight:600}
.kaomoji-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kaomoji-item{min-height:52px;display:flex;align-items:center;justify-content:center;font-size:13px;background:#fff;border:1px solid var(--border);border-radius:10px;cursor:pointer;font-family:monospace;padding:8px 6px;text-align:center;position:relative;overflow:hidden;white-space:nowrap}
.kaomoji-item:active{background:var(--primary-light)}
.emoji-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.emoji-item{aspect-ratio:1;background:#fff;border:1px solid var(--border);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;overflow:hidden;padding:4px;text-align:center}
.emoji-item:active{background:var(--primary-light)}
.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sticker-item{aspect-ratio:1;background:#fff;border:1px solid var(--border);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px;position:relative}
.sticker-item img{width:100%;height:100%;object-fit:contain;border-radius:6px}
.tools-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tool-btn{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:#333;text-decoration:none}
.tool-btn .ic{font-size:22px}
.batch-item{display:flex;gap:8px;padding:8px;background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;align-items:center}
.batch-item .b-type{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--primary-light);color:var(--primary);flex-shrink:0}
.batch-item .b-body{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.batch-item .b-body img{width:36px;height:36px;object-fit:contain;border-radius:6px;vertical-align:middle;background:#f5f5f5}
.batch-item .b-del{border:0;background:transparent;color:#ccc;font-size:16px;cursor:pointer;padding:4px}
.batch-actions{display:flex;gap:8px;margin-top:8px}
.batch-actions button{flex:1;padding:12px;border:0;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
.member-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.member-chip{padding:8px 16px;border:1px solid var(--border);border-radius:20px;background:#fff;font-size:13px;cursor:pointer;color:#555}
.member-chip.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.decide-tabs{display:flex;gap:8px;margin-bottom:12px}
.decide-tab{flex:1;padding:10px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:13px;cursor:pointer;color:#555}
.decide-tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.decide-input,.decide-textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none;margin-bottom:10px;font-family:inherit}
.decide-textarea{resize:vertical;min-height:100px}
.decide-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border);font-size:14px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border:0;background:#F5F5F5;border-radius:50%;font-size:18px;cursor:pointer;color:#333}
.stepper .num{min-width:32px;text-align:center;font-size:15px;font-weight:600;border-bottom:2px dotted #ccc;padding-bottom:2px}
.decide-submit{width:100%;padding:14px;border:0;border-radius:12px;background:#1a1a1a;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.long-menu{position:fixed;background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.2);padding:6px 0;z-index:300;min-width:150px;overflow:hidden}
.long-menu-item{padding:12px 20px;font-size:14px;cursor:pointer;color:#333}
.long-menu-item:active{background:#F5F5F5}
.form{padding:14px}
.form label{display:block;font-size:12px;color:var(--text-light);margin-bottom:12px}
.form input:not([type=color]):not([type=file]),.form select,.form textarea{width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:var(--bg);color:var(--text)}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--primary)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.actions button{flex:1;min-width:90px;padding:13px;border:0;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
.primary{background:var(--primary);color:#fff}
.danger{background:#fdecec;color:#e64340}
.ghost{background:var(--primary-light);color:var(--primary)}
.card-box{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px;border:1px solid var(--border)}
.card-box h3{margin:0 0 10px;font-size:14px;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{padding:6px 14px;border-radius:16px;background:var(--bg);font-size:12px;cursor:pointer;border:1px solid var(--border);color:var(--text-light)}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.card-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.card-item:last-child{border-bottom:0}
.card-item .type{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--primary-light);color:var(--primary);flex:none}
.card-item .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-item img{width:36px;height:36px;object-fit:contain;border-radius:6px;background:#f5f5f5}
.card-item .x{border:0;background:transparent;color:#ccc;cursor:pointer;font-size:15px;padding:4px}
.member{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.member label{flex:1;margin:0;font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px}
.member input[type=number]{width:52px;margin:0;padding:6px;font-size:12px;text-align:center}
.imgpick{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.imgpick img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
.imgpick input[type=file]{font-size:12px;max-width:180px}
.tabs{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:56px;z-index:9;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:12px 14px;font-size:13px;color:var(--text-light);cursor:pointer;white-space:nowrap}
.tabs button.active{color:var(--primary);font-weight:600;border-bottom:2px solid var(--primary)}
.mood-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mood-btn{background:transparent;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;padding:4px}
.mood-btn svg{width:60px;height:60px}
.mood-btn.active svg{filter:drop-shadow(0 0 0.6px var(--primary));transform:scale(1.06)}
.mood-btn.active .mood-label{color:var(--primary);font-weight:600}
.mood-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.mood-row:last-child{border-bottom:0}
.mood-row .em svg{width:44px;height:44px}
.mood-row .who{font-size:12px;color:var(--text-light);margin-bottom:4px}
.mood-row .note{font-size:14px;line-height:1.5;color:var(--text);white-space:pre-wrap;word-break:break-word}
.date-switcher{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px;margin-bottom:14px;background:var(--card);border-radius:14px;border:1px solid var(--border)}
.date-nav{width:38px;height:38px;border:0;background:transparent;font-size:20px;color:#555;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0}
.date-nav:active{background:var(--primary-light)}
.date-label{position:relative;font-size:15px;font-weight:600;color:#333;padding:8px 18px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:6px;min-width:120px;justify-content:center}
.date-label small{font-size:11px;color:var(--primary);font-weight:500;background:#FFF0F3;padding:1px 8px;border-radius:8px}
.date-label input[type=date]{position:absolute;inset:0;opacity:0;cursor:pointer;border:0;background:transparent;width:100%;height:100%}
.todo-chips{display:flex;flex-wrap:wrap;gap:8px}
.todo-chip{padding:8px 16px;background:#F7F7F7;border:1px solid transparent;border-radius:20px;font-size:13px;cursor:pointer;color:#555}
.todo-chip.active{background:#FFF0F3;border-color:var(--primary);color:var(--primary);font-weight:500}
.swipe-wrap{position:relative;overflow:hidden;margin-bottom:12px;border-radius:14px}
.swipe-content{position:relative;z-index:1;transition:transform .2s ease-out;background:var(--card);border:1px solid var(--border);border-radius:14px;will-change:transform;touch-action:pan-y;width:100%;box-sizing:border-box}
.write-page{padding:14px;display:flex;flex-direction:column;min-height:100%}
.write-head-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.write-label{font-size:13px;color:#666;flex-shrink:0}
.write-select{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:#fff;color:#333;outline:none}
.write-toolbar{display:flex;gap:10px;margin-bottom:10px}
.write-tool{width:42px;height:42px;border-radius:50%;border:1px solid #eee;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#666;padding:0;font-size:20px;text-decoration:none}
.write-tool:active{background:var(--primary-light)}
.write-tool svg{width:22px;height:22px}
.write-tool.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.write-picker{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px;max-height:240px;overflow-y:auto}
.write-box{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;display:flex;flex-direction:column;border:1px solid var(--border);min-height:300px}
.write-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.write-head .who{font-size:16px;font-weight:700}
.write-head .status{font-size:12px;color:#bbb}
.write-body{flex:1;font-size:15px;line-height:1.8;color:#666;outline:none;min-height:200px;padding:4px 0}
.write-body:empty:before{content:attr(data-placeholder);color:#bbb;white-space:pre-line}
.write-pending-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.write-pending-imgs .wi{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;background:#f5f5f5;border:1px solid var(--border)}
.write-pending-imgs .wi img{width:100%;height:100%;object-fit:cover}
.write-pending-imgs .wi button{position:absolute;top:-2px;right:-2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;line-height:1}
.send-btn-big{width:100%;padding:16px;border-radius:14px;border:0;background:#1a1a1a;color:#fff;font-size:16px;font-weight:600;cursor:pointer;letter-spacing:2px;margin-top:auto}
.letter-list{padding:8px 0}
.letter-item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0;margin-bottom:10px;overflow:hidden}
.letter-row{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.letter-avatar{width:44px;height:44px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#F5F5F5;display:flex;align-items:center;justify-content:center}
.letter-avatar svg{width:24px;height:24px;color:#bbb}
.letter-main{flex:1;min-width:0}

/* ====== 第一步：新增样式 ====== */
/* ====== 顶部通知弹窗 ====== */
#notificationContainer {
  position: fixed; top: 10px; left: 10px; right: 10px; z-index: 999999;
  display: flex; flex-direction: column; gap: 10px; pointer-events: none;
}
.top-notification {
  background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
  border-radius: 20px; padding: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  display: flex; align-items: center; gap: 12px; pointer-events: auto; cursor: pointer;
  transform: translateY(-120%); opacity: 0; transition: all 0.3s cubic-bezier(0.2,0.8,0.2,1);
  border: 1px solid rgba(0,0,0,0.05);
}
.top-notification.show { transform: translateY(0); opacity: 1; }
.top-notification .tn-avatar {
  width: 42px; height: 42px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.top-notification .tn-avatar img { width: 100%; height: 100%; object-fit: cover; }
.top-notification .tn-content { flex: 1; min-width: 0; }
.top-notification .tn-title { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-notification .tn-desc { font-size: 13px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-notification .tn-type {
  font-size: 10px; padding: 2px 8px; border-radius: 8px; background: var(--primary-light); color: var(--primary); flex-shrink: 0; font-weight: 600;
}

/* ====== 网站内自定义弹窗 ====== */
.custom-modal-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 999999;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  opacity: 0; transition: opacity 0.2s; backdrop-filter: blur(2px);
}
.custom-modal-mask.show { opacity: 1; }
.custom-modal {
  background: #fff; border-radius: 20px; padding: 24px; width: 100%; max-width: 320px;
  text-align: center; transform: scale(0.9); transition: transform 0.2s cubic-bezier(0.2,0.8,0.2,1); box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}
.custom-modal-mask.show .custom-modal { transform: scale(1); }
.custom-modal h3 { margin: 0 0 12px 0; font-size: 17px; color: #333; font-weight: 600; }
.custom-modal p { margin: 0 0 24px 0; font-size: 14px; color: #666; line-height: 1.6; white-space: pre-wrap; word-break: break-word; text-align: left;}
.cm-actions { display: flex; gap: 12px; }
.cm-actions button {
  flex: 1; padding: 12px; border: 0; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
}
.cm-cancel { background: #F5F5F5; color: #666; }
.cm-ok { background: var(--primary); color: #fff; }

/* 轻提示 Toast */
.toast-msg {
  position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
  background: rgba(0,0,0,0.8); color: #fff; padding: 12px 24px; border-radius: 12px;
  font-size: 14px; z-index: 1000000; pointer-events: none; opacity: 0;
  transition: all 0.2s ease-out; text-align: center; max-width: 80vw; word-break: break-word;
  backdrop-filter: blur(4px);
}
.toast-msg.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

<script>
// ====== 全局通知弹窗函数 ======
// type: 'chat' | 'co-invite' | 'listen-invite' | 'moment' | 'moment-comment' | 'letter' | 'call'
// ====== 全局通知弹窗函数 ======
function showTopNotification(title, desc, avatar, onClick, type) {
  let cont = document.getElementById('notificationContainer');
  if (!cont) {
    cont = document.createElement('div');
    cont.id = 'notificationContainer';
    document.body.appendChild(cont);
  }
  
  // 【关键修复】每次清空旧通知，实现覆盖效果
  cont.innerHTML = '';

  const typeLabel = ({
    'chat': '消息', 'co-invite': '共读邀请', 'listen-invite': '一起听',
    'moment': '朋友圈', 'moment-comment': '评论', 'moment-reply': '回复',
    'letter': '信件', 'call': '来电'
  })[type] || '';

  const div = document.createElement('div');
  div.className = 'top-notification';
  div.innerHTML = `
    <div class="tn-avatar">${avatar ? `<img src="${esc(avatar)}">` : esc(title.slice(0,1))}</div>
    <div class="tn-content">
      <div class="tn-title">${esc(title)}${typeLabel?`<span class="tn-type" style="margin-left:6px">${typeLabel}</span>`:''}</div>
      <div class="tn-desc">${esc(desc)}</div>
    </div>
  `;
  
  let isRemoved = false;
  const removeDiv = () => {
    if (isRemoved) return;
    isRemoved = true;
    div.classList.remove('show');
    setTimeout(() => { if(div.parentNode) div.remove(); }, 300);
  };

  div.onclick = () => {
    if(onClick) onClick();
    removeDiv();
  };

  // 【新增功能】添加触摸滑动取消
  let startY = 0;
  div.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    div.style.transition = 'none';
  }, {passive: true});
  
  div.addEventListener('touchmove', e => {
    const dy = e.touches[0].clientY - startY;
    if (dy < 0) { // 向上滑动
      div.style.transform = `translateY(${dy}px)`;
    }
  }, {passive: true});
  
   div.addEventListener('touchend', e => {
    const dy = e.changedTouches[0].clientY - startY;
    div.style.transition = 'all 0.3s cubic-bezier(0.2,0.8,0.2,1)';
    if (dy < -30) { // 上滑超过30px则关闭
      div.style.transform = 'translateY(-120%)';
      div.style.opacity = '0';
      div.style.pointerEvents = 'none'; // 防止透明后还能点到
      setTimeout(() => { if(div.parentNode) div.remove(); }, 300);
    } else {
      div.style.transform = '';
      div.style.opacity = '';
    }
  });

  cont.appendChild(div);
  requestAnimationFrame(() => div.classList.add('show'));
  
  setTimeout(() => {
    if (div.parentNode) removeDiv();
  }, 5000);
}
// ====== 轻提示（替代 alert） ======
function showToast(msg) {
  const div = document.createElement('div');
  div.className = 'toast-msg';
  div.textContent = msg;
  document.body.appendChild(div);
  requestAnimationFrame(() => div.classList.add('show'));
  setTimeout(() => {
    div.classList.remove('show');
    setTimeout(() => div.remove(), 300);
  }, 2500);
}

// ====== 自定义确认框（替代 confirm） ======
function showCustomConfirm(message, title = "提示") {
  return new Promise((resolve) => {
    const mask = document.createElement('div');
    mask.className = 'custom-modal-mask';
    mask.innerHTML = `
      <div class="custom-modal">
        <h3>${esc(title)}</h3>
        <p>${esc(message)}</p>
        <div class="cm-actions">
          <button class="cm-cancel">取消</button>
          <button class="cm-ok">确定</button>
        </div>
      </div>
    `;
    document.body.appendChild(mask);
    requestAnimationFrame(() => mask.classList.add('show'));
    const close = (val) => {
      mask.classList.remove('show');
      setTimeout(() => mask.remove(), 300);
      resolve(val);
    };
    mask.querySelector('.cm-cancel').onclick = () => close(false);
    mask.querySelector('.cm-ok').onclick = () => close(true);
    mask.onclick = (e) => { if(e.target === mask) close(false); };
  });
}

function relativeDateLabel(key){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(key); target.setHours(0,0,0,0);

  if(diff === 0) return '今天';

  if(diff === 1) return '明天';
  return '';
}

function compressImage(file, maxWidth = 800, quality = 0.7, callback, mime = 'image/jpeg') {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL(mime, quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function loadDB(){
  let d = null;
  for(const k of [STORE, ...OLD_KEYS]){
    try{ const raw = localStorage.getItem(k); if(raw){ d = JSON.parse(raw); break; } }catch(e){}
  }
  if(!d) d = blankDB();
  migrate(d);
  if(!Array.isArray(d.couples) || !d.couples.length) d.couples = [newCouple()];
  if(!Array.isArray(d.cards)) d.cards = [];
  if(!d.cards.length){
    DEFAULT_KAOMOJI.forEach(k=>d.cards.push({id:uid(), groupId:'', ownerId:null, type:'kaomoji', content:k}));
    DEFAULT_EMOJI.forEach(e=>d.cards.push({id:uid(), groupId:'', ownerId:null, type:'emoji', content:e}));
  }
  if(d.daily && d.daily.date !== todayKey()) d.daily = { date: todayKey(), letterCount:{}, momentCount:{}, moodCount:{}, callCount:{}, coInviteCount:{}, listenInviteCount:{} };
  if(!d.daily.callCount) d.daily.callCount = {};
  if(!d.daily.coInviteCount) d.daily.coInviteCount = {};
  if(!d.daily.listenInviteCount) d.daily.listenInviteCount = {};
  return d;
}

/* ================= 音乐库核心逻辑 (IndexedDB) ================= */
let musicDB = null;
function initMusicDB() {
  return new Promise((resolve, reject) => {
    if (musicDB) return resolve(musicDB);
    const req = indexedDB.open('ZikaMusicDB', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('tracks')) {
        db.createObjectStore('tracks', { keyPath: 'id' });
      }
    };
    req.onsuccess = e => { musicDB = e.target.result; resolve(musicDB); };
    req.onerror = e => reject(e.target.error);
  });
}
async function saveMusicToDB(track) {
  const db = await initMusicDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('tracks', 'readwrite');
    const store = tx.objectStore('tracks');
    const req = store.put(track);
    req.onsuccess = () => res();
    req.onerror = () => rej();
  });
}
async function getMusicListFromDB() {
  const db = await initMusicDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('tracks', 'readonly');
    const store = tx.objectStore('tracks');
    const req = store.getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej();
  });
}
async function deleteMusicFromDB(id) {
  const db = await initMusicDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('tracks', 'readwrite');
    const store = tx.objectStore('tracks');
    const req = store.delete(id);
    req.onsuccess = () => res();
    req.onerror = () => rej();
  });
}

async function playLocalMusic(id) {
  if(_musicPlayingId === id) {
    if(_musicAudio) _musicAudio.pause();
    _musicPlayingId = null;
    render();
    return;
  }
  if(!_cachedTracks) _cachedTracks = await getMusicListFromDB();
  const track = _cachedTracks.find(t=>t.id===id);
  if(!track) return;

  if(_musicAudio) {
    _musicAudio.pause();
    _musicAudio = null;
  }

  const blob = new Blob([track.data], {type: track.mimeType});
  const url = URL.createObjectURL(blob);
  _musicAudio = new Audio(url);
  _musicAudio.play();
  _musicPlayingId = id;
  render();

  _musicAudio.onended = () => {
    _musicPlayingId = null;
    render();
  };
}
function playListenMusic(trackId) {
  if (_musicAudio) { _musicAudio.pause(); _musicAudio = null; }
  if(!trackId) return;
  const track = _cachedTracks?.find(t => t.id === trackId);
  if(!track) return;

  const blob = new Blob([track.data], {type: track.mimeType});
  const url = URL.createObjectURL(blob);
  _musicAudio = new Audio(url);
  _musicAudio.play();

  clearInterval(window._listenTimer);
  window._listenTimer = setInterval(() => {
    if(ui.page && ui.page.type === 'listen') {
      const bar = document.getElementById('listenProgressBar');
      const cur = document.getElementById('listenCurrentTime');
      const tot = document.getElementById('listenTotalTime');
      if(bar && _musicAudio) {
        const p = (_musicAudio.currentTime / _musicAudio.duration) * 100 || 0;
        bar.style.width = p + '%';
        if(cur) cur.textContent = formatListenTime(_musicAudio.currentTime);
        if(tot) tot.textContent = formatListenTime(_musicAudio.duration);
      }
    } else {
      clearInterval(window._listenTimer);
    }
  }, 500);

  _musicAudio.onended = () => {
    _musicAudio = null;
    clearInterval(window._listenTimer);
    if(ui.page && ui.page.type === 'listen') render();
  };
  render();
}

function formatListenTime(sec) {
  if(!sec || isNaN(sec)) return '00:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function seekListenMusic(e) {
  if(!_musicAudio || !_musicAudio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  _musicAudio.currentTime = percent * _musicAudio.duration;
}

function scheduleListenReply(contactId) {
  if(!db.listenSession) return;
  const c = db.contacts.find(x=>x.id===contactId); if(!c) return;

  const dmin = c.listenGapMin ?? 5;
  const dmax = c.listenGapMax ?? 15;
  const delay = rand(dmin, dmax);

  setTimeout(() => {
    if(!db.listenSession) return;
    const count = rand(c.listenReplyMin ?? 1, c.listenReplyMax ?? 2);
    const ratio = { text:c.listenTextRatio??20, kaomoji:c.listenKaomojiRatio??20, emoji:c.listenEmojiRatio??20, image:c.listenImageRatio??40 };
    const cards = pickCards(c.id, count, ratio);
    let currentDelay = 0;

    cards.forEach((card, i) => {
      currentDelay += i === 0 ? 0 : rand(1, 3) * 1000;
      setTimeout(() => {
        if(!db.listenSession) return;
        const txt = card.type === 'image' ? '[表情包]' : card.content;
        db.listenSession.danmu.push({ id: uid(), from: c.id, content: txt, t: Date.now() });
        save();
        if(ui.page && ui.page.type === 'listen') {
          render();
          setTimeout(()=>{ const el = $('#listenDanmu'); if(el) el.scrollTop = el.scrollHeight; }, 50);
        }
      }, currentDelay);
    });
  }, delay * 1000);
}

function listenAutoTick() {
  if(!db.listenSession || !ui.page || ui.page.type !== 'listen') return;
  const c = db.contacts.find(x=>x.id===db.listenSession.contactId); if(!c) return;
  const now = Date.now();

  if(Math.random() * 100 < (c.listenStickProb ?? 20)) {
    const minInterval = (c.listenStickIntervalMin ?? 5) * 60 * 1000;
    const maxInterval = (c.listenStickIntervalMax ?? 30) * 60 * 1000;
    if(now - (db.listenSession.lastStickTime || 0) > rand(minInterval, maxInterval)) {
      db.listenSession.lastStickTime = now;
      const stickMine = Math.random() * 100 < 50;

      if(stickMine) {
        const myMsgs = db.listenSession.danmu.filter(m => m.from === 'me');
        if(myMsgs.length > 0) {
          const n = rand(c.listenStickOtherMin??1, c.listenStickOtherMax??2);
          const picks = myMsgs.slice(-n).map(m=>m.content);
          if(!db.listenSession.stickMe) db.listenSession.stickMe = [];
          db.listenSession.stickMe = [...new Set([...db.listenSession.stickMe, ...picks])];
        }
      } else {
        const taMsgs = db.listenSession.danmu.filter(m => m.from === c.id);
        if(taMsgs.length > 0) {
          const n = rand(c.listenStickSelfMin??1, c.listenStickSelfMax??2);
          const picks = taMsgs.slice(-n).map(m=>m.content);
          if(!db.listenSession.stickTA) db.listenSession.stickTA = [];
          db.listenSession.stickTA = [...new Set([...db.listenSession.stickTA, ...picks])];
        }
      }
      save(); render();
    }
  }

  if(c.listenAllowUnstick && Math.random() * 100 < (c.listenUnstickProb ?? 5)) {
    if(db.listenSession.stickTA && db.listenSession.stickTA.length > 0) {
      db.listenSession.stickTA.shift();
      save(); render();
    } else if(db.listenSession.stickMe && db.listenSession.stickMe.length > 0) {
      db.listenSession.stickMe.shift();
      save(); render();
    }
  }
}

function lastText(m){
  if(m.type==='system') return m.content;
  if(m.type==='co-invite') return `共读邀请 · 《${m.book||''}》`;
  if(m.type==='co-invite-in') return '邀请你共读';

  if(m.type==='listen-invite-in') return '邀请你一起听';
  if(m.type==='image') return '[图片]';
  if(m.images && m.images.length) return '[图片]';
  return m.content ? (m.content.length>22?m.content.slice(0,22)+'…':m.content) : '';
}
/* ====== 颜色辅助函数 ====== */
function hexToRgb(hex){ hex=String(hex||'').replace('#',''); if(hex.length===3) hex=hex.split('').map(c=>c+c).join(''); const r=parseInt(hex.slice(0,2),16)||0,g=parseInt(hex.slice(2,4),16)||0,b=parseInt(hex.slice(4,6),16)||0; return {r,g,b}; }
function rgbToHex(r,g,b){ const h = x => Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0'); return '#'+h(r)+h(g)+h(b); }
function mixColors(c1, c2, t){ const a=hexToRgb(c1),b=hexToRgb(c2); return rgbToHex(a.r*(1-t)+b.r*t, a.g*(1-t)+b.g*t, a.b*(1-t)+b.b*t); }
function lighten(hex, t){ return mixColors(hex, '#ffffff', t); }
function darken(hex, t){ return mixColors(hex, '#000000', t); }
function normalizeBubbleCss(css){
  return String(css||'')
    .replace(/\.message\b/g, '.msg')
    .replace(/(^|,|\s)\.msg(\.mine|:not\(\.mine\))?\s+/g, '$1'); 
}
function scopeCss(css, scope){
  css = normalizeBubbleCss(css).replace(/\/\*[\s\S]*?\*\//g, '');
  return css.replace(/([^{}]+)\{/g, (match, selectors) => {
    const s = selectors.trim();
    if(!s || /^@/.test(s)) return match;
    const scoped = s.split(',').map(x => x.trim()).filter(Boolean)
      .map(x => `${scope} ${x}`).join(', ');
    return `\n${scoped} {`;
  });
}

/* ====== 消息渲染 ====== */
function msgHtml(m,isGroup,ent){
  if(m.type === 'system'){
    const isCall = (m.content||'').match(/^(来电|拨打|我拨打)/) || (m.content||'').startsWith('我拨打');
    const iconHtml = isCall ? `<span style="display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-right:5px;flex-shrink:0;vertical-align:middle;">${PHONE_ICON}</span>` : '';
    return `<div class="sys-msg" style="display:inline-flex;align-items:center;">${iconHtml}${esc(m.content)}</div>`;
  }
  if(m.type === 'co-invite'){
    const c = db.contacts.find(x=>x.id===m.contactId);
    const status = m.status || 'pending';
    let statusText = '';
    if(status === 'pending') statusText = '等待回应中…';
    else if(status === 'accepted') statusText = '对方接受了你的邀请，开始共读';
    else if(status === 'rejected') statusText = '对方拒绝了共读';

  }

      inner = `<div class="co-status" style="margin-bottom:8px">等你回应…</div><div style="display:flex;gap:8px"><button data-action="co-invite-in-accept" data-id="${m.id}" style="flex:1;padding:9px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-size:13px;font-weight:600;cursor:pointer">接受</button><button data-action="co-invite-in-reject" data-id="${m.id}" style="flex:1;padding:9px;border:0;border-radius:10px;background:#F5F5F5;color:#666;font-size:13px;font-weight:600;cursor:pointer">拒绝</button></div>`;

    return `<div class="co-invite-card"><div class="co-title">${esc(c?.name||'TA')} 邀请你一起听</div>${inner}</div>`;
  }

   const textColor = isLight(color)?'#111':'#fff';

  let bubbleStyle = '';

  if (isCustom) {

  let quoteBlock = '';

  let emotionHtml = '';
  if(m.emotions && m.emotions.length){
    const tagBg = isLight(color) ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.2)';

    emotionHtml = `<div style="margin-top:10px;padding-top:10px;border-top:1px dashed ${borderCol};display:flex;flex-wrap:wrap;gap:8px;">${tags}</div>`;
  }
  const atBadge = m.atMe ? `<span style="font-size:10px;background:var(--primary);color:#fff;border-radius:6px;padding:2px 6px;margin-left:6px;">@你</span>` : '';
  
  return `<div class="msg ${mine?'mine':''}" data-msg-id="${m.id}">
    <div class="m-avatar">${avatarHtml(avatar,name)}</div>

      ${isGroup&&!mine?`<div class="m-name">${esc(name)}${atBadge}</div>`:''}
      ${quoteBlock}
      <div class="bubble" style="${bubbleStyle}">${body}${imgsBlock}${emotionHtml}</div>
      ${timeHtml}
    </div>
  </div>`;
}
/* ====== 字卡抽取 ====== */
function pickCards(contactId, n, ratio={text:20,kaomoji:20,emoji:20,image:40}, opts={}){
  const pool = db.cards.filter(c=>contactUsable(c, contactId));
  if(!pool.length) return [];
  const byType = {text:[], kaomoji:[], emoji:[], image:[]};
  pool.forEach(c=>{ if(byType[c.type]) byType[c.type].push(c); });
  const types = ['text','kaomoji','emoji','image'].filter(t=>byType[t].length);
  if(!types.length) return [];

  const out = [];
  const used = new Set();
  const drawOne = (t) => {
    const arr = byType[t];
    let idx, guard = 0;
    do { idx = Math.floor(Math.random()*arr.length); guard++; } while(used.has(t+'_'+idx) && guard < 30);
    used.add(t+'_'+idx);
    return arr[idx];
  };

  for(let i=0;i<n;i++){
    out.push(drawOne(pickTypeByRatio(types, ratio)));
  }

  const hasMin = opts && opts.imageMin !== undefined && opts.imageMin !== null;
  const hasMax = opts && opts.imageMax !== undefined && opts.imageMax !== null;
  if(types.includes('image') && (hasMin || hasMax)){
    const imgMax = hasMax ? Math.min(n, Math.max(0, Math.floor(opts.imageMax))) : n;
    const imgMin = hasMin ? Math.min(imgMax, Math.max(0, Math.floor(opts.imageMin))) : 0;
    const nonImageTypes = types.filter(t => t !== 'image');
    const positionsOf = (pred) => { const a=[]; out.forEach((c,i)=>{ if(pred(c)) a.push(i); }); return a; };
    const shuffle = a => a.sort(()=>Math.random()-0.5);
    let imgCount = out.filter(c=>c.type==='image').length;

    if(imgCount > imgMax && nonImageTypes.length){
      const imgPos = shuffle(positionsOf(c=>c.type==='image'));
      const toReplace = imgPos.slice(imgMax);
      for(const pos of toReplace) out[pos] = drawOne(pickTypeByRatio(nonImageTypes, ratio));
      imgCount = imgMax;
    }
    if(imgCount < imgMin && byType.image.length){
      const nonImgPos = shuffle(positionsOf(c=>c.type!=='image'));
      const need = imgMin - imgCount;
      const toChange = nonImgPos.slice(0, need);
      for(const pos of toChange) out[pos] = drawOne('image');
    }
  }
  return out;
}
function pickTypeByRatio(types, ratio){
  const total = types.reduce((s,t)=>s+(ratio[t]||0),0);
  if(total<=0) return types[Math.floor(Math.random()*types.length)];
  let r = Math.random()*total;
  for(const t of types){ r -= (ratio[t]||0); if(r<=0) return t; }
  return types[types.length-1];
}

/* ====== 聊天回复 ====== */
function scheduleChatReply(key, isActive = false){
  if(ui.transeMode) return;
  const [type,id]=key.split(':');
  const allMsgs = db.chats[key]||[];
  const lastMine = [...allMsgs].reverse().find(m=>m.from === 'me' && m.type !== 'system');
  if(ui.typing) { ui.typing = null; updateTypingIndicator(); }

  if(type === 'contact'){
    const c = db.contacts.find(x=>x.id===id); if(!c) return;
    // 回复开始即重置主动发消息计时
    c.nextActiveMsgTime = Date.now() + rand(c.activeMsgMin??30, c.activeMsgMax??120) * 60000;
    save();

    const startDelay = isActive ? 3 : rand(c.delayMin??9, c.delayMax??12);
    const count = rand(c.replyMin??1, c.replyMax??3);
    const gapMin = c.replyGapMin ?? 1;
    const gapMax = c.replyGapMax ?? 2;
    const shouldQuote = lastMine && (Math.random()*100 < (c.quoteProb??20));

    setTimeout(() => {
      if (ui.open && (ui.open.type+':'+ui.open.id) === key && !ui.transeMode) {
        ui.typing = { type: 'contact', id: c.id, name: c.name };
        updateTypingIndicator();
      }
    }, 500);

    setTimeout(()=>{
      if(ui.transeMode) return;
      if (ui.typing && ui.typing.id === c.id) { ui.typing = null; updateTypingIndicator(); }
      const items = pickCards(c.id, count, { text:c.chatTextRatio??20, kaomoji:c.chatKaomojiRatio??20, emoji:c.chatEmojiRatio??20, image:c.chatImageRatio??40 }, { imageMin: c.chatImageMinPerRound ?? 0, imageMax: c.chatImageMaxPerRound ?? 99 });
      let cum = 0;
      const delays = items.map((_, i)=>{ if(i > 0) cum += randF(gapMin, gapMax) * 1000; return cum; });
      items.forEach((card,i)=>setTimeout(()=>{
        if(ui.transeMode) return;
        if(!db.chats[key]) db.chats[key]=[];
        const msgEmotions = generateEmotionTags();
        db.chats[key].push({ id:uid(), from:c.id, type:card.type, content:card.content, quoteId: (shouldQuote && i===0) ? lastMine.id : null, images: [], t: Date.now(), emotions: msgEmotions });
        save();
        if(ui.open&&(ui.open.type+':'+ui.open.id)===key){
            render(); scrollBottom();
                               } else {
            c.unreadCount = (c.unreadCount || 0) + 1;
            if(ui.tab === 'chats' && !ui.open && !ui.page && !ui.editing) render(); else renderNav();
            const preview = card.type === 'image' ? '[图片]' : card.content;
            showTopNotification(c.name, preview, c.avatar, () => {
                ui.open = { type: 'contact', id: c.id }; ui.page = null; render();
            }, isActive ? 'chat' : 'chat');
        }
      }, delays[i]));
    }, startDelay * 1000);
  } else if(type === 'group'){
    const g = db.groups.find(x=>x.id===id); if(!g) return;
    const baseDelay = rand(g.delayMin??9, g.delayMax??12);
    const memberGapMin = g.memberGapMin ?? 1; const memberGapMax = g.memberGapMax ?? 2;
    const replyGapMin = g.replyGapMin ?? 1; const replyGapMax = g.replyGapMax ?? 2;
    const responders = [];
    g.members.forEach(m => {
      if(Math.random()*100 >= (m.prob??65)) return;
      const c = db.contacts.find(x=>x.id===m.contactId); if(!c) return;
      const count = rand(m.replyMin??1, m.replyMax??2);
      const cards = pickCards(c.id, count, { text:g.chatTextRatio??20, kaomoji:g.chatKaomojiRatio??20, emoji:g.chatEmojiRatio??20, image:g.chatImageRatio??40 }, { imageMin: m.imgMin ?? 0, imageMax: m.imgMax ?? 99 });
      if(!cards.length) return;
      const shouldQuote = lastMine && (Math.random()*100 < (c.quoteProb??20));
      responders.push({c, cards, shouldQuote, atProb: m.atProb ?? 5});
    });

    let cum = baseDelay * 1000;
    const timeline = [];
    responders.forEach((r, ri) => {
      r.cards.forEach((card, ci) => {
        if (ri === 0 && ci === 0) {}
        else if (ci === 0) cum += randF(memberGapMin, memberGapMax) * 1000;
        else cum += randF(replyGapMin, replyGapMax) * 1000;
        const atMe = (ci===0) && (Math.random()*100 < (r.atProb||5));
        timeline.push({ at: cum, from: r.c.id, fromName: r.c.name, type: card.type, content: card.content, quoteId: (r.shouldQuote && ci===0) ? lastMine.id : null, atMe });
      });
    });

    if (responders.length > 0) {
      timeline.forEach(item => {
        const c = db.contacts.find(x => x.id === item.from);
        if (!c) return;
        const isFirst = (item === timeline[0]);
        const leadTime = isFirst ? 2000 : 1500;
        const showTime = Math.max(500, item.at - leadTime);
        setTimeout(() => {
          if (ui.open && (ui.open.type+':'+ui.open.id) === key && !ui.transeMode) {
            ui.typing = { type: 'group', id: g.id, name: c.name };
            updateTypingIndicator();
          }
        }, showTime);
      });
      const lastAt = timeline[timeline.length - 1].at;
      setTimeout(() => {
        if (ui.typing && ui.typing.id === g.id) {
          ui.typing = null; updateTypingIndicator();
        }
      }, lastAt + 1000);
    }

    timeline.forEach(item => {
      setTimeout(()=>{
        if(ui.transeMode) return;
        if(!db.chats[key]) db.chats[key]=[];
        const msgEmotions = generateEmotionTags();
        const finalContent = item.atMe ? `@${db.me.name} ${item.content}` : item.content;
        db.chats[key].push({ id:uid(), from:item.from, type:item.type, content:finalContent, quoteId: item.quoteId, images: [], t: Date.now(), emotions: msgEmotions, atMe: !!item.atMe });
        save();
        if(ui.open && (ui.open.type+':'+ui.open.id) === key){
            render(); scrollBottom();
                         } else {
            g.unreadCount = (g.unreadCount || 0) + 1;
            if(ui.tab === 'chats' && !ui.open && !ui.page && !ui.editing) render(); else renderNav();
            const sender = db.contacts.find(x=>x.id === item.from);
            const preview = item.type === 'image' ? '[图片]' : (item.atMe ? `@你 ${item.content}` : item.content);
            showTopNotification(g.name, `${sender?.name||'成员'}：${preview}`, g.avatar, () => {
                ui.open = { type: 'group', id: g.id }; ui.page = null; render();
            }, 'chat');
        }
      }, item.at);
    });
  }
}

/* ====== 后台统一调度 ====== */
function tickBackground(){
  resetDailyIfNeeded();
  const now = Date.now();
  tryActiveMsgTick(now);
  tryActiveMood(now);
  tryActiveMoment(now);
  tryActiveLetter(now);
  tryActiveCall(now);
  if(!db.coSession && !ui.coInviting){ tryCoInviteFromContact(now); }
  if(!db.listenSession){ tryListenInviteFromContact(now); }
  if(db.coSession){
    const c = db.contacts.find(x=>x.id===db.coSession.contactId);
    if(c){
      const prob = c.coActiveCardProb ?? 5;
      if(Math.random()*100 < prob){
        const cooldown = (c.coCooldown ?? 30) * 60 * 1000;
        if(now - (db.coSession.lastActiveCardTime||0) >= cooldown){
          const pick = coPickCard(c.id);
          if(pick){ db.coSession.stream.push({ type:'card', groupName: pick.groupName, text: pick.card.content, t: now }); db.coSession.lastActiveCardTime = now; save(); if(ui.page && ui.page.type==='coRead') render(); }
        }
      }
    }
  }
}

/* ====== 主动发消息 ====== */
function tryActiveMsgTick(now){
  db.contacts.forEach(c=>{
    if(!c.nextActiveMsgTime){
      c.nextActiveMsgTime = now + rand(c.activeMsgMin??30, c.activeMsgMax??120) * 60000;
      return;
    }
    if(now < c.nextActiveMsgTime) return;
    c.nextActiveMsgTime = now + rand(c.activeMsgMin??30, c.activeMsgMax??120) * 60000;
    if(isViewingContact(c.id)) return;
    if(Math.random()*100 >= (c.activeMsgProb??20)) return;
    scheduleChatReply('contact:'+c.id, true);
  });
  save();
}

/* ====== 主动心情 ====== */
function tryActiveMood(now){
  db.contacts.forEach(c=>{
    const maxN = c.moodMaxPerDay||0;
    if(maxN<=0) return;
    const interval = rand(c.moodChangeInterval||120, c.moodChangeIntervalMax||180) * 60000;
    if(now - (c.lastMoodTime||0) < interval) return;
    if(Math.random()*100 >= 40) return;
    c.lastMoodTime = now;
    const mood = MOODS[Math.floor(Math.random()*MOODS.length)];
    const todos = [];
    const maxT = c.moodTodoMaxPerDay||5;
    const n = rand(0, Math.min(maxT,3));
    const shuffled = [...TODO_OPTIONS].sort(()=>Math.random()-0.5);
    for(let i=0;i<n;i++) todos.push(shuffled[i]);
    let note = '';
    const noteCards = pickCards(c.id, rand(c.moodNoteCardMin||0, c.moodNoteCardMax||2), {text:c.moodNoteTextRatio??20,kaomoji:c.moodNoteKaomojiRatio??20,emoji:c.moodNoteEmojiRatio??20,image:c.moodNoteStickerRatio??40});
    noteCards.forEach(card=>{ if(card.type!=='image') note += (note?' ':'')+card.content; });
    db.moods.push({id:uid(), who:c.id, mood:mood.key, t:now, note: note.slice(0, db.moodSettings.noteMaxLen), todos, images:[]});
    save();
  });
}

/* ====== 主动朋友圈 ====== */
function tryActiveMoment(now){
  db.daily.momentCount = db.daily.momentCount||{};
  db.contacts.forEach(c=>{
    const prob = c.momentPostProb||0;
    if(prob<=0) return;
    const maxD = c.momentMaxPerDay||0;
    if(maxD<=0) return;
    const todayN = db.daily.momentCount[c.id]||0;
    if(todayN >= maxD) return;
    if(now - (c.lastMomentTime||0) < 30*60000) return;
    if(Math.random()*100 >= prob) return;
    c.lastMomentTime = now;
    db.daily.momentCount[c.id] = todayN+1;
    const cards = pickCards(c.id, rand(1,2), {text:c.momentTextRatio??20,kaomoji:c.momentKaomojiRatio??20,emoji:c.momentEmojiRatio??20,image:c.momentStickerRatio??40});
    let content=''; let images=[];
    cards.forEach(card=>{ if(card.type==='image') images.push(card.content); else content += (content?' ':'')+card.content; });
    db.moments.push({id:uid(), who:c.id, content, images, t:now, comments:[]});
    save();
    if(!isViewingPage('moments')){
      showTopNotification(c.name, '发了一条朋友圈', c.avatar, ()=>{ ui.page={type:'moments'}; ui.open=null; render(); }, 'moment');

      render();
    }
  });
}

  const prob = c.momentReplyCommentProb ?? 70;
  if (Math.random() * 100 >= prob) return;

  setTimeout(() => {
    const currentMoment = db.moments.find(x => x.id === moment.id); if (!currentMoment) return;

    let replyText = ''; let replyImages = [];

function scheduleLetterReply(contactId, letterId){
  const c = db.contacts.find(x=>x.id===contactId); if(!c) return;
  if(Math.random()*100 >= (c.letterReplyProb??80)) return;
  const delay = rand(c.letterReplyDelayMin??30, c.letterReplyDelayMax??120);
  setTimeout(()=>{
    const n = rand(c.letterReplyCardMin??1, c.letterReplyCardMax??3);
    const cards = pickCards(c.id, n, { text:c.letterTextRatio??20, kaomoji:c.letterKaomojiRatio??20, emoji:c.letterEmojiRatio??20, image:c.letterStickerRatio??40 });
    let content = '', images = [];
    if(cards.length){
      const texts = [];
      cards.forEach(card=>{ if(card.type === 'image') images.push(card.content); else texts.push(card.content); });
      content = texts.join('\n') || (images.length ? '（给你寄了一张图）' : '我收到你的信了。');
    } else content = '我收到你的信了。';
    addInboxLetter(c, content, images, letterId);
  }, delay*60*1000);
}

/* ========== 共读核心 ========== */
function coPickCard(contactId){
  const sysRatio = db.coSettings.systemRatio ?? 80;
  const cusRatio = db.coSettings.customRatio ?? 20;
  const totalR = sysRatio + cusRatio;
  let useSystem = true;
  if(totalR > 0){ useSystem = (Math.random() * totalR) < sysRatio; }
  const poolType = useSystem ? 'system' : 'custom';
  let groups = db.coGroups.filter(g=>g.type===poolType && g.enabled && (g.weight||0) > 0);
  if(!groups.length){ groups = db.coGroups.filter(g=>g.enabled && (g.weight||0) > 0); if(!groups.length) return null; }
  const totalW = groups.reduce((s,g)=>s+(g.weight||0), 0);
  let r = Math.random() * totalW;
  let chosen = groups[groups.length-1];
  for(const g of groups){ r -= (g.weight||0); if(r<=0){ chosen = g; break; } }
  const cards = db.coCards.filter(c=>c.groupId===chosen.id && c.enabled);
  if(!cards.length) return null;
  const card = cards[Math.floor(Math.random()*cards.length)];
  return { card, groupName: chosen.name, groupType: chosen.type };
}

function coStartSession(contactId, book){
  const c = db.contacts.find(x=>x.id===contactId);
  if(!c) return;
  db.coSession = { contactId, book, startTime: Date.now(), stream: [], lastActiveCardTime: 0 };
  save();
}
function coEndSession(){
  if(!db.coSession) return;
  const s = db.coSession;
  const c = db.contacts.find(x=>x.id===s.contactId);
  const endTime = Date.now();
  const durationMin = Math.round((endTime - s.startTime) / 60000);
  db.coReadHistory.push({ id: uid(), contactId: s.contactId, contactName: c?.name || '未知', book: s.book, startTime: s.startTime, endTime, durationMin, stream: s.stream });
  if(c) pushMsg('contact:'+c.id, 'system', 'system', `共读结束 · 《${s.book}》`, null, []);
  db.coSession = null;
  save();
}
function coAppendThought(text){
  if(!db.coSession) return;
  db.coSession.stream.push({ type:'thought', text, t: Date.now() });
  save();
  const c = db.contacts.find(x=>x.id===db.coSession.contactId);
  if(!c) return;
  const dmin = c.coReplyDelayMin ?? 15;
  const dmax = c.coReplyDelayMax ?? 120;
  const delay = rand(dmin, dmax);
  if(ui.coThinkTimer) clearTimeout(ui.coThinkTimer);
  ui.coThinkTimer = setTimeout(()=>{
    if(!db.coSession) return;
    let pick = coPickCard(c.id);
    if(!pick){
      const fallback = db.coCards.filter(x=>x.enabled);
      if(fallback.length){
        const card = fallback[Math.floor(Math.random()*fallback.length)];
        pick = { card, groupName: '回应', groupType: 'system' };
      }
    }
    if(pick){
      db.coSession.stream.push({ type:'card', groupName: pick.groupName, text: pick.card.content, t: Date.now() });
      save();
    }
    ui.coThinking = false;
    if(ui.page && ui.page.type==='coRead') render();
  }, delay * 1000);
}

  db.coSession.stream.push({ type:'card', groupName: pick.groupName, text: pick.card.content, t: now });

}

function coReadView(){
  if(!db.coSession){
    return `<div class="topbar"><button class="icon" data-action="cancel">${ICONS.back}</button><h1>共读</h1></div><div class="form"><div class="empty">当前没有进行中的共读<br>去「与他共读」邀请一位联系人吧</div></div>`;
  }
  const s = db.coSession;
  const c = db.contacts.find(x=>x.id===s.contactId);
  return `
  <div class="topbar"><button class="icon" data-action="cancel">${ICONS.back}</button><h1>共读 · 《${esc(s.book)}》</h1><button class="icon" data-action="co-end">✕</button></div>
  <div class="co-read-page">
    <div class="co-read-stream" id="coStream">
      ${s.stream.length ? s.stream.map(m=>{
        if(m.type === 'thought') return `<div class="co-thought"><div class="co-meta">我的想法 · ${fmtTimeOnly(m.t)}</div><div class="co-body">${esc(m.text)}</div></div>`;
        return `<div class="co-card"><div class="co-meta">${esc(m.groupName||'回应')}</div><div class="co-body">${esc(m.text)}</div></div>`;
      }).join('') : '<div class="empty" style="padding:30px">还没有共读内容<br>点下方按钮写点想法吧</div>'}
      ${ui.coThinking ? `<div class="co-thinking">${esc(c?.name||'对方')}正在思考…</div>` : ''}
    </div>
    <div class="actions" style="padding:12px 16px 18px;background:#fff;border-top:1px solid var(--border)">
      <button data-action="co-write" style="flex:1;padding:13px;border:0;border-radius:14px;background:var(--primary);color:#fff;font-size:14px;font-weight:600;cursor:pointer">+ 写想法</button>
    </div>
  </div>`;
}

/* ========== 写想法 ========== */
function coWriteView(){
  const c = db.coSession ? db.contacts.find(x=>x.id===db.coSession.contactId) : null;
  const meAvatarHtml = db.me.avatar
    ? `<img src="${esc(db.me.avatar)}" style="max-width:100%;max-height:100%;object-fit:contain;display:block">`
    : `<span class="avatar-txt">${esc((db.me.name||'?').slice(0,1))}</span>`;
  return `
  <div class="topbar"><button class="icon" data-action="cancel">${ICONS.back}</button><h1>写想法</h1></div>
  <div style="padding:18px 14px 20px;flex:1;display:flex;flex-direction:column;min-height:0">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)">
      <div style="width:60px;height:60px;border-radius:14px;overflow:hidden;background:#f5f5f5;flex-shrink:0;display:flex;align-items:center;justify-content:center">
        ${meAvatarHtml}
      </div>
      <div style="min-width:0">
        <div style="font-size:15px;font-weight:600;color:#333">${esc(db.me.name||'我')}</div>
        <div style="font-size:12px;color:#999;margin-top:2px">正在与 ${esc(c?.name||'TA')} 共读《${esc(db.coSession?.book||'')}》</div>
      </div>
    </div>
    <div style="font-size:13px;color:#666;margin-bottom:8px">写点想法：</div>
    <textarea id="coWriteInput" placeholder="随便写，写多长都可以……" style="flex:1;min-height:200px;font-size:15px;line-height:1.8;padding:14px;border:1px solid var(--border);border-radius:14px;outline:none;resize:none;font-family:inherit;background:#fff;box-sizing:border-box">${esc(ui.coWriteText||'')}</textarea>
    <button data-action="co-send" style="width:100%;padding:16px;border-radius:14px;border:0;background:#1a1a1a;color:#fff;font-size:16px;font-weight:600;cursor:pointer;letter-spacing:2px;margin-top:16px">发送想法</button>
  </div>`;
}

/* ========== 共读记录 ========== */
function coHistoryView(){
  const list = [...db.coReadHistory].sort((a,b)=>b.startTime-a.startTime);
  const q = (ui.coHistoryQuery||'').toLowerCase();
  const filtered = q ? list.filter(h => (h.contactName||'').toLowerCase().includes(q) || (h.book||'').toLowerCase().includes(q)) : list;
  const stats = {};
  list.forEach(h=>{
    if(!stats[h.contactId]) stats[h.contactId] = { name: h.contactName, days: new Set(), totalMin: 0, books: new Set() };
    const d = new Date(h.startTime);
    stats[h.contactId].days.add(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`);
    stats[h.contactId].totalMin += h.durationMin;
    stats[h.contactId].books.add(h.book);
  });
  return `
  <div class="topbar"><button class="icon" data-action="cancel">${ICONS.back}</button><h1>共读记录</h1></div>
  <div class="form">
    ${Object.keys(stats).length ? Object.entries(stats).map(([cid,s])=>{
      const hours = Math.floor(s.totalMin / 60);
      const mins = s.totalMin % 60;
      return `<div class="card-box">
        <div class="co-stat-line">和 <b>${esc(s.name)}</b> 共读 <b>${s.days.size}</b> 天<br>共 <b>${hours}</b> 小时 <b>${mins}</b> 分钟<br>你和 ${esc(s.name)} 一起读了 <b>${s.books.size}</b> 本书<br>分别为：</div>
        <div style="font-size:14px;color:#666;line-height:1.9;margin-top:4px">${[...s.books].map(b=>`《${esc(b)}》`).join('<br>')}</div>
      </div>`;
    }).join('') : '<div class="empty">还没有共读记录</div>'}
    <div class="card-box"><h3>🔍 查找</h3>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="coHistorySearch" placeholder="按联系人名字或书名搜索…" value="${esc(ui.coHistoryQuery)}" style="flex:1;padding:10px 12px;border:1px solid #F0F0F0;border-radius:10px;font-size:14px;outline:none;box-sizing:border-box;min-width:0">
        <button data-action="co-history-search" style="padding:10px 18px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;flex-shrink:0;font-size:14px">搜索</button>
      </div>
    </div>
    <div class="card-box"><h3>最近共读</h3>
      ${filtered.length ? filtered.slice(0,50).map(h=>{
        const d = new Date(h.startTime);
        const title = `${d.getMonth()+1}月${d.getDate()}日与 ${h.contactName} 共读《${h.book}》`;
        return `<div class="co-history-item" style="display:flex;align-items:center;gap:8px">
          <div style="flex:1;min-width:0;cursor:pointer" data-action="co-history-open" data-id="${h.id}">
            <div class="co-h-title">${esc(title)}</div>
            <div class="co-h-sub">${h.durationMin} 分钟</div>
          </div>
          <button data-action="co-history-del" data-id="${h.id}" title="删除" style="border:0;background:transparent;color:#ccc;cursor:pointer;font-size:16px;padding:6px;line-height:1;flex-shrink:0">✕</button>
        </div>`;
      }).join('') : '<div class="empty" style="padding:20px">没有匹配的记录</div>'}
    </div>
  </div>`;
}

function coHistoryDetailView(){
  const h = db.coReadHistory.find(x=>x.id===ui.page.id);
  if(!h) return `<div class="topbar"><button class="icon" data-action="cancel">${ICONS.back}</button><h1>共读记录</h1></div><div class="form"><div class="empty">记录不存在</div></div>`;
  const d = new Date(h.startTime);
  const title = `${d.getMonth()+1}月${d.getDate()}日与 ${h.contactName} 共读《${h.book}》`;
  return `
  <div class="topbar"><button class="icon" data-action="cancel">${ICONS.back}</button><h1>${esc(title)}</h1></div>
  <div class="form">
    <div style="font-size:12px;color:#999;margin-bottom:10px">共读时长 ${h.durationMin} 分钟</div>
    ${h.stream && h.stream.length ? h.stream.map(m=>{
      if(m.type === 'thought') return `<div class="co-thought" style="max-width:100%;margin-bottom:10px"><div class="co-meta">我的想法 · ${fmtTimeOnly(m.t)}</div><div class="co-body">${esc(m.text)}</div></div>`;
      return `<div class="co-card" style="max-width:100%;margin-bottom:10px"><div class="co-meta">${esc(m.groupName||'回应')}</div><div class="co-body">${esc(m.text)}</div></div>`;
    }).join('') : '<div class="empty">这次共读没有记录内容</div>'}
  </div>`;
}

    return `
    <div class="topbar"><h1>字卡管理</h1></div>
    <div class="form">
      <div class="pool-list">

          <div class="pool-icon">${ICONS.chat}</div>
          <div class="pool-main"><div class="pool-title">聊天字卡</div><div class="pool-sub">日常聊天用的字卡</div></div>
          <div class="pool-count">${chatCount}</div>
        </div>
        <div class="pool-item" data-action="card-pool-open" data-pool="emotion">
          <div class="pool-icon">${ICONS.heart}</div>
          <div class="pool-main"><div class="pool-title">情绪字卡</div><div class="pool-sub">按情绪分类的字卡</div></div>
          <div class="pool-count">${emoCount}</div>
        </div>
        <div class="pool-item" data-action="card-pool-open" data-pool="coread">
          <div class="pool-icon">${ICONS.book}</div>
          <div class="pool-main"><div class="pool-title">共读字卡</div><div class="pool-sub">共读模式使用的字卡</div></div>
          <div class="pool-count">${coCount}</div>
        </div>

  }
  if(ui.cardPool === 'chat'){
    const ownerOptions = `<option value="">公用（所有联系人可用）</option><option value="${ME_OWNER}">我的专属（只有我能用）</option>` + db.contacts.map(c=>`<option value="${c.id}">专属：${esc(c.name)}</option>`).join('');
    return `<div class="topbar"><button class="icon" data-action="card-pool-back">${ICONS.back}</button><h1>聊天字卡</h1></div><div class="form">${chatCardsBody(ownerOptions)}</div>`;
  }
  if(ui.cardPool === 'emotion'){
    return `<div class="topbar"><button class="icon" data-action="card-pool-back">${ICONS.back}</button><h1>情绪字卡</h1></div><div class="form">${emotionEditView()}</div>`;
  }

  }

}

/* ========== 聊天字卡 ========== */
function chatCardsBody(ownerOptions){
  const kindTab = (ui.cardKindTab==='image') ? 'image' : 'text';
  const groupsOfKind = db.cardGroups.filter(g=>g.kind === kindTab);
  const groupOptions = groupsOfKind.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');
  let typeFilter = ui.cardFilter.type;
  if(kindTab === 'text'){ if(!['all','text','kaomoji','emoji'].includes(typeFilter)) typeFilter = 'all'; }
  else { if(!['all','image'].includes(typeFilter)) typeFilter = 'all'; }
  const allFiltered = db.cards.filter(c=>{
    if(kindTab === 'text' && c.type === 'image') return false;
    if(kindTab === 'image' && c.type !== 'image') return false;
    if(ui.cardFilter.ownerId!=='all'){ if(ui.cardFilter.ownerId==='public'){ if(c.ownerId) return false; } else if(c.ownerId!==ui.cardFilter.ownerId) return false; }
    if(typeFilter!=='all' && c.type!==typeFilter) return false;
    if(ui.cardFilter.search){ const q = ui.cardFilter.search.toLowerCase(); if(!String(c.content).toLowerCase().includes(q)) return false; }
    return true;
  });
  const renderCard = c => {
    const owner = c.ownerId === ME_OWNER ? '我的专属' : (c.ownerId ? (db.contacts.find(x=>x.id===c.ownerId)?.name||'已删除') : '公用');
    const tl = {text:'文字',kaomoji:'颜文字',emoji:'Emoji',image:'表情包'}[c.type]||c.type;
    const preview = c.type==='image'?`<img src="${esc(c.content)}">`:`<span class="txt">${esc(c.content)}</span>`;
    const sel = ui.selectedCards.includes(c.id);
    const check = ui.manageMode ? `<div class="check">✓</div>` : '';
    return `<div class="card-item ${ui.manageMode?'selectable':''} ${sel?'selected':''}" data-action="${ui.manageMode?'mc-toggle':'none'}" data-id="${c.id}">${check}${preview}<span class="type">${tl}</span><span class="type" style="background:#efe;color:#575">${esc(owner)}</span>${!ui.manageMode?`<button class="x" data-action="del-card" data-id="${c.id}">✕</button>`:''}</div>`;
  };
  return `
    <div class="card-tabs" style="margin-top:0">
      <button class="card-tab ${kindTab==='text'?'active':''}" data-action="switch-chat-kind" data-k="text">文字/颜文字/Emoji</button>
      <button class="card-tab ${kindTab==='image'?'active':''}" data-action="switch-chat-kind" data-k="image">表情包</button>
    </div>
    <div class="chips">
      ${kindTab==='text'?`
        <button class="chip ${typeFilter==='all'?'active':''}" data-action="filter-type" data-t="all">全部</button>
        <button class="chip ${typeFilter==='text'?'active':''}" data-action="filter-type" data-t="text">文字</button>
        <button class="chip ${typeFilter==='kaomoji'?'active':''}" data-action="filter-type" data-t="kaomoji">颜文字</button>
        <button class="chip ${typeFilter==='emoji'?'active':''}" data-action="filter-type" data-t="emoji">Emoji</button>
      `:`<button class="chip ${typeFilter==='all'?'active':''}" data-action="filter-type" data-t="all">全部表情包</button>`}
    </div>
    <div class="mini-actions">
      <button class="mini-btn ${ui.manageMode?'active':''}" data-action="toggle-manage"><span class="ico">☑</span>${ui.manageMode?'取消':'管理'}</button>
      <button class="mini-btn" data-action="open-group-manager"><span class="ico">📁</span>分组</button>
      <button class="mini-btn" data-action="dedupe-open"><span class="ico">🔍</span>查重</button>
      <button class="mini-btn" data-action="export-cards"><span class="ico">⬆</span>导出</button>
      <label class="mini-btn" style="cursor:pointer"><span class="ico">⬇</span>导入<input type="file" id="importCardsFile" accept=".json,application/json" class="hidden-file"></label>
      <button class="mini-btn danger" data-action="clear-all-cards"><span class="ico">🗑</span>清空</button>
    </div>
    ${ui.manageMode?`<div class="mc-toolbar"><button data-action="mc-select-all">全选/取消 (${ui.selectedCards.length})</button><button data-action="mc-move">移动到分组</button><button class="primary" data-action="mc-delete">删除选中</button></div>`:''}
    <div class="card-box" style="margin-top:0"><h3>批量添加</h3>
      <div class="grid2"><label>类型<select id="add-type">${kindTab==='text'?`<option value="text">文字</option><option value="kaomoji">颜文字</option><option value="emoji">Emoji</option>`:`<option value="image">表情包（图片）</option>`}</select></label><label>归属<select id="add-owner">${ownerOptions}</select></label></div>
      <label>分组<select id="add-group">${groupOptions||'<option value="">（无分组）</option>'}</select></label>
      ${kindTab==='text'?`<label>内容（每行一张，空行忽略）<textarea id="add-lines" rows="4" placeholder="&#10;(＾▽＾)&#10;😄"></textarea></label>`:`<label>从相册选择图片（1~99 张）<input type="file" id="add-files" accept="image/*" multiple></label>`}
      <button class="primary" style="width:100%;padding:12px;border-radius:12px;margin-top:8px" data-action="batch-add">批量添加</button>
    </div>
    <div class="card-box"><h3>${kindTab==='text'?'文字/颜文字/Emoji 字卡':'表情包'}（${allFiltered.length}）</h3>
      <input class="search-box" id="cardSearch" placeholder="🔍 搜索" value="${esc(ui.cardFilter.search)}" style="margin-bottom:12px;width:100%;padding:10px 12px;border:1px solid #F0F0F0;border-radius:10px;font-size:14px;outline:none">
      <div class="chips">
        <button class="chip ${ui.cardFilter.ownerId==='all'?'active':''}" data-action="filter-owner" data-id="all">全部</button>
        <button class="chip ${ui.cardFilter.ownerId==='public'?'active':''}" data-action="filter-owner" data-id="public">公用</button>
        <button class="chip ${ui.cardFilter.ownerId===ME_OWNER?'active':''}" data-action="filter-owner" data-id="${ME_OWNER}">我的</button>
        ${db.contacts.map(c=>`<button class="chip ${ui.cardFilter.ownerId===c.id?'active':''}" data-action="filter-owner" data-id="${c.id}">${esc(c.name)}</button>`).join('')}
      </div>
      <div style="max-height:400px;overflow:auto">${allFiltered.length?allFiltered.map(renderCard).join(''):'<div class="empty" style="padding:24px">暂无字卡</div>'}</div>
    </div>`;
}

/* ========== 共读字卡 ========== */
function coCardsBody(){
  const sysGroups = db.coGroups.filter(g=>g.type==='system');
  const cusGroups = db.coGroups.filter(g=>g.type==='custom');
  const sysCount = db.coCards.filter(c=>sysGroups.some(g=>g.id===c.groupId)).length;
  const cusCount = db.coCards.filter(c=>cusGroups.some(g=>g.id===c.groupId)).length;
  const subTab = ui.coPoolTab || 'system';
  const total = (db.coSettings.systemRatio||80) + (db.coSettings.customRatio||20);
  return `
  <div class="card-box" style="margin-top:0">
    <h3>系统池 vs 自定义池</h3>
    <div class="grid2"><label>系统池占比<input type="number" id="co-sys-ratio" value="${db.coSettings.systemRatio||80}" min="0" max="100"></label><label>自定义池占比<input type="number" id="co-cus-ratio" value="${db.coSettings.customRatio||20}" min="0" max="100"></label></div>
    <p style="font-size:11px;color:#bbb;margin:4px 0 0">当前实际比例：系统 ${Math.round((db.coSettings.systemRatio/(total||1))*100)}% · 自定义 ${Math.round((db.coSettings.customRatio/(total||1))*100)}%</p>
  </div>
  <div class="card-tabs" style="margin-top:0">
    <button class="card-tab ${subTab==='system'?'active':''}" data-action="co-pool-tab" data-t="system">系统共读 <span class="num">${sysCount}</span></button>
    <button class="card-tab ${subTab==='custom'?'active':''}" data-action="co-pool-tab" data-t="custom">自定义共读 <span class="num">${cusCount}</span></button>
  </div>
  ${subTab==='system' ? coSystemBody(sysGroups) : coCustomBody(cusGroups)}`;
}
function coSystemBody(groups){
  return groups.map(g=>{
    const cards = db.coCards.filter(c=>c.groupId===g.id);
    return `<div class="card-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <h3 style="margin:0">${esc(g.name)}</h3>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#666">
          权重 <input type="number" data-co-weight="${g.id}" value="${g.weight||0}" min="0" style="width:60px;padding:4px 6px;border:1px solid #eee;border-radius:6px;font-size:12px">
          <span class="chip ${g.enabled?'active':''}" data-action="co-toggle-group" data-id="${g.id}" style="cursor:pointer;${g.enabled?'':'background:#eee;color:#999;border-color:#eee'}">${g.enabled?'开':'关'}</span>

/* ========== 查重 ========== */
function findDuplicateCards(){
  const map = new Map();
  db.cards.forEach(c=>{
    const key = c.type + '|' + c.content;
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(c);
  });
  const dups = [];
  map.forEach((cards, key)=>{ if(cards.length > 1) dups.push({ key, cards }); });
  dups.sort((a,b)=>b.cards.length - a.cards.length);
  return dups;
}

}

function openCrop(src, mode, onDone){
  const div = document.createElement('div');
  div.className = 'crop-mask';
  const isBg = mode === 'bg';
  div.innerHTML = `<div class="crop-box" id="cropBox"><img id="cropImg" src="${src}"><div class="crop-frame"></div></div><div class="crop-toolbar"><span>缩放</span><input type="range" min="50" max="300" value="100" id="cropZoom"></div><div class="crop-actions"><button class="cancel" id="cropCancel">取消</button><button class="ok" id="cropOk">确定</button></div>`;
  document.body.appendChild(div);
  const img = div.querySelector('#cropImg');
  const box = div.querySelector('#cropBox');
  const zoom = div.querySelector('#cropZoom');
  let scale = 1, tx = 0, ty = 0, baseW = 1, baseH = 1;
  const redraw = ()=>{ img.style.width = (baseW * scale) + 'px'; img.style.height = (baseH * scale) + 'px'; img.style.left = '50%'; img.style.top = '50%'; img.style.transform = `translate(-50%, -50%) translate(${tx}px, ${ty}px)`; };
  const onLoad = ()=>{ const bw = box.clientWidth, bh = box.clientHeight; const naturalRatio = img.naturalWidth / img.naturalHeight; if(naturalRatio > bw / bh){ baseH = bh; baseW = bh * naturalRatio; } else { baseW = bw; baseH = bw / naturalRatio; } redraw(); };
  img.onload = onLoad; if(img.complete && img.naturalWidth) onLoad();
  zoom.addEventListener('input', ()=>{ scale = zoom.value/100; redraw(); });
  let dragging = false, sx=0, sy=0, otx=0, oty=0;
  const start = (x, y)=>{ dragging = true; sx=x; sy=y; otx=tx; oty=ty; };
  const move = (x, y)=>{ if(!dragging) return; tx = otx + (x - sx); ty = oty + (y - sy); redraw(); };
  const end = ()=>{ dragging = false; };
  box.addEventListener('touchstart', e=>{ const t=e.touches[0]; start(t.clientX, t.clientY); }, {passive:true});
  box.addEventListener('touchmove', e=>{ const t=e.touches[0]; move(t.clientX, t.clientY); e.preventDefault(); }, {passive:false});
  box.addEventListener('touchend', end);
  box.addEventListener('mousedown', e=>start(e.clientX, e.clientY));
  document.addEventListener('mousemove', e=>move(e.clientX, e.clientY));
  document.addEventListener('mouseup', end);
  div.querySelector('#cropCancel').onclick = ()=>div.remove();
  div.querySelector('#cropOk').onclick = ()=>{
    const out = 400;
    const canvas = document.createElement('canvas');
    if(isBg){ canvas.width = img.naturalWidth; canvas.height = img.naturalHeight; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0); div.remove(); onDone(canvas.toDataURL('image/jpeg', 0.85)); return; }
    canvas.width = out; canvas.height = out;
    const ctx = canvas.getContext('2d');
    const sw = img.naturalWidth, sh = img.naturalHeight;
    const dispW = baseW * scale, dispH = baseH * scale;
    const offsetX = -tx, offsetY = -ty;
    const cx = (dispW/2 + offsetX) / dispW;
    const cy = (dispH/2 + offsetY) / dispH;
    const side = Math.min(dispW, dispH);
    const sx = cx * dispW - side/2;
    const sy = cy * dispH - side/2;
    const scaleToNat = sw / dispW;
    ctx.drawImage(img, sx*scaleToNat, sy*scaleToNat, side*scaleToNat, side*scaleToNat, 0, 0, out, out);
    div.remove();
    onDone(canvas.toDataURL('image/jpeg', 0.9));
  };
}
