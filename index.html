function saveGroup(id){
  const members=[];
  $$('[data-member]').forEach(cb=>{
    if(!cb.checked) return;
    const cid=cb.dataset.member;
    members.push({
      contactId:cid,
      prob:Math.min(100,Math.max(0,+($(`[data-mprob="${cid}"]`)?.value)||0)),
      replyMin:Math.max(1,+($(`[data-mmin="${cid}"]`)?.value)||1),
      replyMax:Math.max(1,+($(`[data-mmax="${cid}"]`)?.value)||1),
      imgMin:Math.max(0,+($(`[data-mimgmin="${cid}"]`)?.value)||0),
      imgMax:Math.max(0,+($(`[data-mimgmax="${cid}"]`)?.value)||99),
      atProb: Math.min(100, Math.max(0, +($(`[data-matprob="${cid}"]`)?.value)||0))
    });
  });
  const gn = (id, def) => { const el = $(id); if(!el) return def; const v = parseFloat(el.value); return isNaN(v)?def:v; };
  const gMeColorEl = $('#f-g-me-color');
  const data = {
    name: ($('#f-name')?.value||'未命名群聊').trim(),
    avatar: ui.draft.avatar, background: ui.draft.background,
    delayMin: gn('#f-dmin', 9), delayMax: gn('#f-dmax', 12),
    memberGapMin: gn('#f-mgapmin', 1), memberGapMax: gn('#f-mgapmax', 2),
    replyGapMin: gn('#f-rgapmin', 1), replyGapMax: gn('#f-rgapmax', 2),
    chatTextRatio: gn('#f-gtext', 20), chatKaomojiRatio: gn('#f-gkaomoji', 20),
    chatEmojiRatio: gn('#f-gemoji', 20), chatImageRatio: gn('#f-gimage', 40),
    members,
    meBubbleColor: gMeColorEl ? gMeColorEl.value : db.me.bubbleColor
  };
  if(id){ const g = db.groups.find(x=>x.id===id); if(g) Object.assign(g,data); } else { db.groups.push({id:uid(), ...data}); }
  save(); render();
}

async function saveContactToAll(id){
  const src = db.contacts.find(x=>x.id===id); if(!src) return;
  if(!(await showCustomConfirm('将该联系人的全部设置（除昵称、头像、聊天背景、气泡颜色、气泡图片外）应用到所有联系人？'))) return;
  db.contacts.forEach(c=>{
    if(c.id===id) return;
    const keep = {id:c.id,name:c.name,avatar:c.avatar,background:c.background,bubbleColor:c.bubbleColor,bubbleCustom:c.bubbleCustom,bubbleStyle:c.bubbleStyle};
    Object.keys(src).forEach(k=>{ if(!(k in keep)) c[k]=src[k]; });
  });
  save(); showToast('已应用到全部联系人');
}

function renderCallFloat(){
  const host = document.getElementById('overlayHost');
  if(ui.call && ui.call.floating){
    const c = db.contacts.find(x=>x.id===ui.call.contactId);
    if(!c){ ui.call=null; host.innerHTML=''; return; }
    let f = document.getElementById('callFloat');
    if(f){ const t = Math.floor((Date.now() - (ui.call.start || Date.now()))/1000); const timeStr = String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); const timeEl = f.querySelector('.cf-time'); if(timeEl) timeEl.textContent = timeStr; return; }
    host.innerHTML = `<div class="call-float" id="callFloat" style="left:${ui.call.fx}px;top:${ui.call.fy}px"><div class="cf-avatar">${avatarHtml(c.avatar, c.name)}</div><div class="cf-main"><div class="cf-name">${esc(c.name)}</div><div class="cf-time">00:00</div></div><button class="cf-hang" data-action="call-hangup">${ICONS.hangup}</button></div>`;
    f = document.getElementById('callFloat');
    let dragging = false, sx=0, sy=0, ox=0, oy=0;
    const startDrag = (x, y) => { dragging = true; sx = x; sy = y; ox = f.offsetLeft; oy = f.offsetTop; };
    const moveDrag = (x, y) => { if(!dragging) return; const nx = ox + (x - sx); const ny = oy + (y - sy); f.style.left = Math.max(4, Math.min(window.innerWidth - f.offsetWidth - 4, nx)) + 'px'; f.style.top  = Math.max(4, Math.min(window.innerHeight - f.offsetHeight - 4, ny)) + 'px'; if(ui.call){ ui.call.fx = f.offsetLeft; ui.call.fy = f.offsetTop; } };
    const endDrag = () => { dragging = false; };
    f.addEventListener('touchstart', e => { if(e.target.closest('button')) return; const t = e.touches[0]; startDrag(t.clientX, t.clientY); }, {passive:true});
    f.addEventListener('touchmove', e => { if(!dragging) return; const t = e.touches[0]; moveDrag(t.clientX, t.clientY); }, {passive:true});
    f.addEventListener('touchend', endDrag);
    f.addEventListener('mousedown', e => { if(e.target.closest('button')) return; startDrag(e.clientX, e.clientY); });
    document.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
    document.addEventListener('mouseup', endDrag);
    if(!ui.call.floatTimer){ ui.call.floatTimer = setInterval(() => { if(!ui.call || !ui.call.floating || !ui.call.connected) return; const t = Math.floor((Date.now() - (ui.call.start || Date.now()))/1000); const timeEl = document.querySelector('#callFloat .cf-time'); if(timeEl) timeEl.textContent = String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }, 1000); }
  } else {

      else if(reason === '已挂断' && !dur) pushMsg(key, 'system', 'system', `${c.name} 来电 · 已挂断`, null, []);
      else if(dur > 0) pushMsg(key, 'system', 'system', `${c.name} 来电 · 通话已挂断 · 时长 ${durStr}`, null, []);

/* ---------- 情绪标签 ---------- */
function generateEmotionTags() {
  if (!db.emotionSettings || db.emotionSettings.enabled === false) return null;
  const baseProb = db.emotionSettings.prob ?? 70;
  if (Math.random() * 100 >= baseProb) return null;
  const typeWeights = db.emotionSettings.typeWeights || { emotion: 30, heart: 30, intent: 40 };
  const dualProb = db.emotionSettings.dualProb ?? 15;
  const types = [{ key: 'emotion', name: '情绪' }, { key: 'heart', name: '心意' }, { key: 'intent', name: '交流意图' }];
  function pickWeighted(pool){ const total = pool.reduce((s,t)=>s + (typeWeights[t.key]||0), 0); if(total <= 0) return pool[Math.floor(Math.random()*pool.length)]; let r = Math.random() * total; for(const t of pool){ r -= (typeWeights[t.key]||0); if(r <= 0) return t; } return pool[pool.length - 1]; }
  const wantTwo = Math.random() * 100 < dualProb;
  const pickedTypes = []; const first = pickWeighted(types); pickedTypes.push(first);
  if(wantTwo){ const remaining = types.filter(t => t.key !== first.key); pickedTypes.push(pickWeighted(remaining)); }
  const result = [];
  pickedTypes.forEach(t => {
    const groups = db.emotionGroups.filter(g => g.type === t.key);
    if(!groups.length) return;
    const validGroups = groups.filter(g => g.weight > 0);
    if(!validGroups.length) return;
    const totalWeight = validGroups.reduce((sum, g) => sum + g.weight, 0);
    let rWeight = Math.random() * totalWeight; let selectedGroup = validGroups[0];
    for(let g of validGroups){ rWeight -= g.weight; if(rWeight <= 0){ selectedGroup = g; break; } }
    const cards = db.emotionCards.filter(c => c.groupId === selectedGroup.id && c.enabled !== false);
    if(!cards.length) return;
    const card = cards[Math.floor(Math.random() * cards.length)];
    result.push({ type: t.name, text: card.content });
  });
  return result.length ? result : null;
}

      case 'transe-exit': exitTranseMode(); break;
      case 'transe-type': { const t = el.dataset.t; if(ui.transeType === t) break; if(ui.transeTempGroup.length && !(await showCustomConfirm('切换牌种会清空当前已抽的牌，确定吗？'))) break; ui.transeType = t; ui.transeTempGroup = []; ui.transeFlipped = {}; render(); break; }
      case 'transe-draw': { const pool = ui.transeType === 'tarot' ? TAROT_CARDS : LENORMAND_CARDS; const available = pool.filter(c => !ui.transeTempGroup.some(t => t.name === c.name)); if(!available.length){ showToast('牌堆已抽空'); break; } const card = available[Math.floor(Math.random() * available.length)]; const idx = ui.transeTempGroup.length; ui.transeTempGroup.push(card); ui.transeFlipped[idx] = false; render(); break; }
      case 'transe-flip': { const i = parseInt(el.dataset.i,10); ui.transeFlipped[i] = !ui.transeFlipped[i]; render(); break; }
      case 'transe-clear': { if(!ui.transeTempGroup.length) break; if(!(await showCustomConfirm('清空当前已抽的牌？'))) break; ui.transeTempGroup = []; ui.transeFlipped = {}; render(); break; }
      case 'transe-send': {
        if(!ui.open) break;
        const group = ui.transeTempGroup.slice();
        if(!group.length){ showToast('请先抽牌'); break; }
        const key = ui.open.type + ':' + ui.open.id;
        if(!db.chats[key]) db.chats[key] = [];
        const typeName = ui.transeType === 'tarot' ? '塔罗' : '雷诺曼';
        const groupIdx = db.chats[key].filter(m=>m.isTarot).length + 1;
        let content = `【第 ${groupIdx} 组牌 · ${typeName}】\n`;
        group.forEach((card, i) => { content += `${i + 1}. ${card.name}（${card.desc}）\n`; });
        db.chats[key].push({ id: uid(), from: 'system', type: 'system', content, quoteId: null, images: [], t: Date.now(), isTarot: true, transeType: ui.transeType, tarotGroup: group, tarotAnalysis: '' });
        ui.transeTempGroup = []; ui.transeFlipped = {};
        save(); render(); scrollBottom();
        break;
      }
      case 'tarot-edit': { ui.tarotEditingId = id; render(); setTimeout(() => { const box = document.querySelector(`[data-tarot-edit-id="${id}"]`); if(box){ box.focus(); } }, 40); break; }
      case 'tarot-save': { const box = document.querySelector(`[data-tarot-edit-id="${id}"]`); if(box){ const key = ui.open.type + ':' + ui.open.id; const msg = (db.chats[key] || []).find(m => m.id === id); if(msg){ msg.tarotAnalysis = box.innerText; save(); } } ui.tarotEditingId = null; render(); break; }

      /* ===== 音乐库 ===== */
      case 'music-switch-group': ui.musicGroupId = el.dataset.id; render(); break;
      case 'music-add-group': { const name = prompt('新分组名称'); if(name && name.trim()){ db.musicGroups.push({id:uid(), name:name.trim()}); save(); render(); } break; }
      case 'music-play': playLocalMusic(id); break;
      case 'music-del': { if(!(await showCustomConfirm('确定删除这首歌吗？'))) break; await deleteMusicFromDB(id); if(_musicPlayingId === id && _musicAudio) { _musicAudio.pause(); _musicPlayingId = null; } _cachedTracks = await getMusicListFromDB(); render(); break; }
      case 'music-group-rename': { const g = db.musicGroups.find(x=>x.id===id); if(!g) break; const name = prompt('修改分组名称', g.name); if(name && name.trim()){ g.name = name.trim(); save(); render(); } break; }
      case 'music-group-del': { if(id === 'default') { showToast('默认分组不可删除'); break; } if(!(await showCustomConfirm('删除该分组？组内歌曲回到默认。'))) break; db.musicGroups = db.musicGroups.filter(x=>x.id!==id); if(_cachedTracks){ for(let i=0; i<_cachedTracks.length; i++){ if(_cachedTracks[i].groupId === id){ _cachedTracks[i].groupId = 'default'; await saveMusicToDB(_cachedTracks[i]); } } } ui.musicGroupId = 'all'; save(); render(); break; }

      /* ===== 一起听 ===== */
      case 'listen-choose-music': { if(!_cachedTracks) _cachedTracks = await getMusicListFromDB(); ui.listenMusicModal = true; render(); break; }
      case 'listen-music-cancel': { ui.listenMusicModal = false; render(); break; }
      case 'listen-pick-song': {
        ui.listenMusicModal = false;
        if(db.listenSession) {
          const track = _cachedTracks?.find(x=>x.id===id);
          if(track) {
            db.listenSession.songId = id;
            db.listenSession.songTitle = track.title;
            db.listenSession.artist = track.artist || '未知歌手';
            db.listenSession.cover = track.cover || '';
          }
        }
        save(); playListenMusic(id); break;
      }
      case 'listen-play': {
        if(!db.listenSession || !db.listenSession.songId) { showToast('请先点击右上角选择音乐'); break; }
        if(_musicAudio && !_musicAudio.paused) {
          _musicAudio.pause();
          ui.listenIsPlaying = false;
        } else {
          playListenMusic(db.listenSession.songId);
          ui.listenIsPlaying = true;
        }
        render();
        break;
      }
      case 'listen-send': {
        const text = (ui.listenInputText || '').trim();
        if(!text || !db.listenSession) break;
        db.listenSession.danmu.push({ id: uid(), from: 'me', content: text, t: Date.now() });
        ui.listenInputText = '';
        save(); render();
        setTimeout(()=>{ const el = $('#listenDanmu'); if(el) el.scrollTop = el.scrollHeight; }, 50);
        scheduleListenReply(db.listenSession.contactId);
        break;
      }
      case 'listen-stick': {
        if(!db.listenSession) break;
        const msg = db.listenSession.danmu.find(x=>x.id===id);
        if(!msg) break;
        const targetArr = msg.from === 'me' ? 'stickMe' : 'stickTA';
        if(!db.listenSession[targetArr]) db.listenSession[targetArr] = [];
        if(!db.listenSession[targetArr].includes(msg.content)) {
          db.listenSession[targetArr].push(msg.content);
          const c = db.contacts.find(x=>x.id===db.listenSession.contactId);
          if(c) {
             const limit = msg.from === 'me' ? (c.listenStickOtherMax ?? 2) : (c.listenStickSelfMax ?? 2);
             while(db.listenSession[targetArr].length > limit) db.listenSession[targetArr].shift();
          }
          save(); render();
        }
        break;
      }
      case 'listen-unstick': {
        if(!db.listenSession) break;
        const contentToRemove = el.dataset.content;
        const targetArr = el.dataset.from === 'me' ? 'stickMe' : 'stickTA';
        if(db.listenSession[targetArr]) {
          const idx = db.listenSession[targetArr].indexOf(contentToRemove);
          if(idx > -1) { db.listenSession[targetArr].splice(idx, 1); save(); render(); }
        }
        break;
      }
      case 'toggle-listen-unstick': { const c = db.contacts.find(x=>x.id===id); if(!c) break; c.listenAllowUnstick = !c.listenAllowUnstick; save(); render(); break; }

      /* ===== 一起听邀请（对方发来，我接受/拒绝） ===== */
      case 'listen-invite-in-accept': {
        const key = ui.open.type+':'+ui.open.id;
        const m = (db.chats[key]||[]).find(x=>x.id===el.dataset.id);
        if(!m || m.status !== 'pending'){ break; }
        const c = db.contacts.find(x=>x.id===m.from);
        if(!c) break;
        m.status = 'accepted';
        db.listenSession = {
          contactId: c.id, startTime: Date.now(), songId: null,
          songTitle: '尚未选择歌曲', artist: '点击右上角选择', cover: '',
          danmu: [], stickTA: [], stickMe: [], isPlaying: false
        };
        if(_cachedTracks && _cachedTracks.length > 0) {
          const tr = _cachedTracks[Math.floor(Math.random()*_cachedTracks.length)];
          db.listenSession.songId = tr.id;
          db.listenSession.songTitle = tr.title;
          db.listenSession.artist = tr.artist || '未知歌手';
        }
        save(); ui.open = null; ui.page = {type:'listen'}; render();
        break;
      }
      case 'listen-invite-in-reject': {
        const key = ui.open.type+':'+ui.open.id;
        const m = (db.chats[key]||[]).find(x=>x.id===el.dataset.id);
        if(!m || m.status !== 'pending'){ break; }
        m.status = 'rejected';
        save(); render();
        break;
      }
    }
  } catch(err){ console.warn('click error:', err); }
});

/* ================= change 补充 ================= */
document.addEventListener('change', async e=>{
  try{
    const el = e.target;

    // 群成员勾选联动
    if(el.dataset && el.dataset.member){
      const card = el.closest('.group-member-card');
      if(card) card.classList.toggle('disabled', !el.checked);
      return;
    }

     if(el.id==='font-preset'){ const A = ui.appearanceDraft || db.appearance; A.fontFamily = el.value; A.customFontUrl = ''; applyAppearance(); render(); return; }
    if(el.id==='font-file'){
      const f = el.files[0]; if(!f) return;
      if(f.size > 3*1024*1024){ showToast('字体文件太大（>3MB），无法导入'); el.value=''; return; }
      if(f.size > 1.5*1024*1024 && !(await showCustomConfirm('字体较大，会占用较多浏览器存储空间，确定继续？'))){ el.value=''; return; }
      const r = new FileReader();
      r.onload = () => { const A = ui.appearanceDraft || db.appearance; A.customFontUrl = r.result; A.fontFamily = ''; applyAppearance(); render(); };
      r.readAsDataURL(f); el.value=''; return;
    }
    if(el.id==='global-bg-file'){
      const f = el.files[0]; if(!f) return;
      compressImage(f, 1000, 0.7, (dataUrl)=>{ const A = ui.appearanceDraft || db.appearance; A.chatBackground = dataUrl; applyAppearance(); render(); });
      el.value=''; return;
    }
    if(el.id==='chat-image-file'){ [...el.files].forEach(f => { compressImage(f, 800, 0.7, (dataUrl) => { ui.composerImages.push(dataUrl); render(); }); }); el.value=''; return; }
    if(el.id==='batch-image-file'){ const f = el.files[0]; if(!f) return; compressImage(f, 800, 0.7, (dataUrl) => { ui.batchList.push({type:'image', content:dataUrl}); render(); }); el.value=''; return; }
    if(el.id==='f-ls-bg'){
      const f = el.files[0]; if(!f) return;
      compressImage(f, 1200, 0.8, (dataUrl) => {
        const c = db.contacts.find(x=>x.id===ui.editing?.id);
        if(c) { c.listenBg = dataUrl; save(); const pv = $('#pv-ls-bg'); if(pv){ pv.src = dataUrl; pv.style.display='block'; } }
      });
      el.value=''; return;
    }
    if(el.id==='music-files') {
      const files = [...el.files];
      if(!files.length) return;
      el.value = '';
      const groupId = ui.musicGroupId === 'all' ? 'default' : ui.musicGroupId;
      let count = 0;
      for(const f of files) {
        if(f.size > 20 * 1024 * 1024) { showToast(`文件 ${f.name} 超过 20MB，已跳过`); continue; }
        const nameWithoutExt = f.name.replace(/\.[^/.]+$/, "");
        const track = { id: uid(), title: nameWithoutExt, artist: '', groupId: groupId, size: f.size, mimeType: f.type, data: f };
        await saveMusicToDB(track);
        count++;
      }
      _cachedTracks = await getMusicListFromDB();
      showToast(`成功导入 ${count} 首歌曲`);
      render();
      return;
    }
    if(el.id==='importCardsFile'){ const f=el.files[0]; if(f) importCardsFile(f); el.value=''; return; }
    if(el.id==='importBackupFile'){ const f=el.files[0]; if(f) importBackupFile(f); el.value=''; return; }
    if(el.dataset.moodDateChange !== undefined){ const v = el.value; if(v){ ui.moodViewDate = inputToDateKey(v); render(); } return; }
    if(el.id==='write-to'){ ui.writeTo = el.value; return; }
    if(el.id==='write-files'){ [...el.files].forEach(f => { compressImage(f, 800, 0.7, (dataUrl) => { ui.pendingWriteImages.push(dataUrl); render(); }); }); el.value=''; return; }
    if(el.id==='moment-files'){ [...el.files].forEach(f => { compressImage(f, 800, 0.7, (dataUrl) => { ui.pendingMomentImages.push(dataUrl); render(); }); }); el.value=''; return; }
    if(el.hasAttribute('data-me-avatar-crop')){ const f = el.files[0]; if(!f) return; const r = new FileReader(); r.onload = ()=>{ openCrop(r.result, 'avatar', (dataUrl)=>{ db.me.avatar = dataUrl; save(); render(); }); }; r.readAsDataURL(f); el.value=''; return; }
    if(el.dataset.cavatarCrop){ const [cid, who] = el.dataset.cavatarCrop.split('|'); const f = el.files[0]; if(!f) return; const r = new FileReader(); r.onload = ()=>{ openCrop(r.result, 'avatar', (dataUrl)=>{ const c = db.couples.find(x=>x.id===cid); if(c){ c[who].avatar = dataUrl; save(); render(); } }); }; r.readAsDataURL(f); el.value=''; return; }
    if(el.dataset.fileCrop === 'avatar'){ const f = el.files[0]; if(!f) return; const r = new FileReader(); r.onload = ()=>{ openCrop(r.result, 'avatar', (dataUrl)=>{ ui.draft.avatar = dataUrl; const pv = $('#pv-avatar'); if(pv){ pv.src = dataUrl; pv.style.display='block'; } }); }; r.readAsDataURL(f); el.value=''; return; }

    /* 气泡自定义图片：me / ta */
    if(el.dataset.bubbleCustom){
      const f = el.files[0]; if(!f) return;
      const target = el.dataset.bubbleCustom;
      compressImage(f, 500, 0.9, (dataUrl)=>{
        if(target === 'me'){
          db.me.bubbleCustom = dataUrl; db.me.bubbleStyle = 'custom'; save(); render();
        } else {
          ui.draft.bubbleCustom = dataUrl;
          const c = db.contacts.find(x=>x.id===ui.editing?.id);
          if(c){ c.bubbleCustom = dataUrl; c.bubbleStyle = 'custom'; }
          save(); render();
        }
      }, 'image/png');
      el.value=''; return;
    }
       if(el.id==='me-bubble-css-file' || el.id==='c-bubble-css-file' || el.id==='c-my-bubble-css-file'){
      const f = el.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = () => {
        if(el.id==='me-bubble-css-file'){
          db.me.bubbleCss = r.result; save(); applyAppearance(); render();
        } else {
          const c = db.contacts.find(x=>x.id===ui.editing?.id);
          if(c){
            if(el.id==='c-bubble-css-file') c.bubbleCss = r.result;
            else c.myBubbleCss = r.result;
            save(); applyAppearance(); render();
          }
        }
      };
      r.readAsText(f); el.value=''; return;
    }
    const input = el.closest('input[type=file]');
    if(!input || !input.dataset.file) return;
    const key = input.dataset.file; const f = input.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{ if(key === 'background'){ compressImage(f, 1200, 0.75, (dataUrl) => { ui.draft[key] = dataUrl; const pv = $(`#pv-bg`); if(pv){ pv.src=dataUrl; pv.style.display='block'; } }); } else { ui.draft[key] = r.result; const pv = $('#pv-avatar'); if(pv){ pv.src=r.result; pv.style.display='block'; } } };
    r.readAsDataURL(f);
  } catch(err){ console.warn('change error:', err); }
});

/* ================= render 包装（含 overlay 弹窗） ================= */
const _origRender = render;
render = function(){
  applyAppearance();
  _origRender();
  const host = document.getElementById('overlayHost');
  const oldModal = document.querySelector('.letter-modal-mask');
  if(oldModal && !ui.coInviteModal && !ui.letterModalId && !ui.coBookPrompt && !ui.listenMusicModal) oldModal.remove();
  if(ui.letterModalId && !ui.coInviteModal){
    const html = letterModalHtml(ui.letterModalId);
    if(html){ const wrap = document.createElement('div'); wrap.innerHTML = html; host.appendChild(wrap.firstElementChild); }
  }
  if(ui.coInviteModal){
    const html = coInviteModalHtml();
    if(html){ const wrap = document.createElement('div'); wrap.innerHTML = html; host.appendChild(wrap.firstElementChild); }
  }
  if(ui.coBookPrompt){
    const html = coBookPromptHtml();
    if(html){ const wrap = document.createElement('div'); wrap.innerHTML = html; host.appendChild(wrap.firstElementChild); }
  }
  if(ui.listenMusicModal){
    const tracks = _cachedTracks || [];
    const html = `<div class="letter-modal-mask" style="z-index:99999"><div class="letter-modal" style="max-width:340px;max-height:70vh;display:flex;flex-direction:column"><h3>选择音乐</h3><div style="flex:1;overflow-y:auto;margin-bottom:14px">${tracks.length ? tracks.map(t=>`<div class="card-item" style="padding:12px 0;cursor:pointer" data-action="listen-pick-song" data-id="${t.id}"><div style="flex:1;font-size:14px;font-weight:600;color:#333">${esc(t.title)}</div></div>`).join('') : '<div class="empty">曲库为空</div>'}</div><button data-action="listen-music-cancel" style="width:100%;padding:12px;border:0;border-radius:10px;background:#eee;color:#333;font-weight:600;cursor:pointer">关闭</button></div></div>`;
    if(html){ const wrap = document.createElement('div'); wrap.innerHTML = html; host.appendChild(wrap.firstElementChild); }
  }
};

/* ================= msgHtml 包装（塔罗渲染） ================= */
const _origMsgHtml = msgHtml;
msgHtml = function(m, isGroup, ent) {
  if (m.isTarot && m.type === 'system') {
    const groupName = m.content.split('\n')[0];
    const cards = m.tarotGroup || [];
    const isEditing = ui.tarotEditingId === m.id;
    const hasContent = m.tarotAnalysis && m.tarotAnalysis.trim();
    let analysisHtml = '';
    if(isEditing){ analysisHtml = `<div class="tarot-analysis-box" contenteditable="true" data-tarot-edit-id="${m.id}">${esc(m.tarotAnalysis || '')}</div><div class="tarot-edit-actions"><button data-action="tarot-save" data-id="${m.id}">完成</button></div>`; }
    else { analysisHtml = `<div class="tarot-analysis-view">${hasContent ? esc(m.tarotAnalysis) : '<span style="color:#bbb">（暂无解析，点「编辑」添加）</span>'}</div><div class="tarot-edit-actions"><button class="view-btn" data-action="tarot-edit" data-id="${m.id}">编辑</button></div>`; }
    return `<div class="tarot-result-msg"><h4>${esc(groupName)}</h4><div class="tarot-result-imgs">${cards.map(c => `<div class="tarot-card flipped">${esc(c.name)}</div>`).join('')}</div><div style="font-size:12px; color:#666; line-height:1.6; margin-bottom:8px;">${cards.map(c => `• ${c.name}：${c.desc}`).join('<br>')}</div>${analysisHtml}</div>`;
  }
  return _origMsgHtml(m, isGroup, ent);
};

/* ================= 启动 ================= */
render();
setInterval(tickBackground, 20000);

// 启动开屏动画
(function initSplash() {
  const html = `
    <div id="splashScreen">
      <div class="splash-card">
        <div class="splash-title">WELCOME</div>
        <div class="splash-name">${esc(db.me.name || 'your name')}</div>
        <button class="splash-btn">Enter</button>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', html);
  document.querySelector('.splash-btn').onclick = () => {
    const splash = document.getElementById('splashScreen');
    splash.classList.add('hide');
    setTimeout(() => splash.remove(), 600);
  };
})();
</script>
